<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
<title>Errores de la brújula magnética en el hemisferio norte: virajes (UNOS) y aceleraciones (ANDS)</title>
<defs>
<marker id="020-errores-brujula-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
<marker id="020-errores-brujula-fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
</defs>
<circle cx="320" cy="200" r="90" class="soft"/>
<text x="320" y="124" class="tx b" text-anchor="middle">N</text>
<text x="320" y="288" class="tx b" text-anchor="middle">S</text>
<text x="420" y="205" class="tx b" text-anchor="middle">E</text>
<text x="220" y="205" class="tx b" text-anchor="middle">O</text>
<line x1="390" y1="190" x2="390" y2="150" class="wa-ln thick" marker-end="url(#020-errores-brujula-fw)"/>
<line x1="250" y1="190" x2="250" y2="150" class="wa-ln thick" marker-end="url(#020-errores-brujula-fw)"/>
<text x="320" y="196" class="tx2" font-size="11" text-anchor="middle">hemisferio norte</text>
<text x="320" y="24" class="txa b" text-anchor="middle">N: UNOS (Undershoot North)</text>
<text x="320" y="42" class="tx2" text-anchor="middle">en un viraje la brújula se queda corta</text>
<text x="320" y="58" class="tx2" text-anchor="middle">Sal antes de que marque N</text>
<text x="320" y="340" class="txa b" text-anchor="middle">S: UNOS (Overshoot South)</text>
<text x="320" y="358" class="tx2" text-anchor="middle">la brújula se adelanta</text>
<text x="320" y="374" class="tx2" text-anchor="middle">Sigue girando pasado el S</text>
<text x="450" y="160" class="txw b">E y O: ANDS</text>
<text x="450" y="178" class="tx2" font-size="12">Acelerar: marca un viraje</text>
<text x="450" y="193" class="tx2" font-size="12">hacia el norte.</text>
<text x="450" y="212" class="tx2" font-size="12">Decelerar: hacia el sur.</text>
<text x="450" y="231" class="tx2" font-size="12">En viraje no hay error.</text>
<text x="190" y="160" class="txw b" text-anchor="end">E y O: ANDS</text>
<text x="190" y="178" class="tx2" font-size="12" text-anchor="end">El error de aceleración</text>
<text x="190" y="193" class="tx2" font-size="12" text-anchor="end">es máximo con rumbos</text>
<text x="190" y="212" class="tx2" font-size="12" text-anchor="end">este y oeste; en N y S</text>
<text x="190" y="231" class="tx2" font-size="12" text-anchor="end">no hay.</text>
</svg>
