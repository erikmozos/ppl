<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <title>Resultante aerodinámica descompuesta en sustentación (perpendicular al viento relativo) y resistencia (paralela), en vuelo nivelado y en ascenso</title>
  <defs>
    <marker id="080-resultante-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
    <marker id="080-resultante-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
    <marker id="080-resultante-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
  </defs>
  <line x1="320" y1="14" x2="320" y2="346" class="ln2"/>
  <text x="160" y="26" class="tx b" text-anchor="middle">Resultante aerodinámica</text>
  <path d="M100 130 C125 70 250 58 380 76 C460 87 520 108 560 130 C490 136 390 142 290 146 C200 149 130 148 100 130 Z" class="ac" transform="translate(186 196) rotate(12) scale(0.44) translate(-330 -130)"/>
  <line x1="110" y1="217" x2="297" y2="217" class="ln2 dash"/>
  <line x1="87" y1="175" x2="294.8" y2="219.1" class="ac-ln dash"/>
  <path d="M193 217 A92 92 0 0 1 195 197.9" class="wa-ln"/>
  <text x="177" y="211" class="txw b" font-size="15">α</text>
  <line x1="10" y1="161" x2="64" y2="161" class="ln" marker-end="url(#080-resultante-k)"/>
  <text x="10" y="151" class="tx2">viento relativo</text>
  <text x="57" y="199" class="txa">cuerda</text>
  <line x1="146.4" y1="187.6" x2="146.4" y2="67.6" class="ac-ln thick" marker-end="url(#080-resultante-a)"/>
  <line x1="146.4" y1="187.6" x2="178.4" y2="187.6" class="wa-ln thick" marker-end="url(#080-resultante-w)"/>
  <line x1="146.4" y1="187.6" x2="178.4" y2="67.6" class="ln thick" marker-end="url(#080-resultante-k)"/>
  <line x1="146.4" y1="67.6" x2="178.4" y2="67.6" class="ln2 dash"/>
  <line x1="178.4" y1="187.6" x2="178.4" y2="67.6" class="ln2 dash"/>
  <path d="M155.4 187.6 L155.4 178.6 L146.4 178.6" class="ln2"/>
  <circle cx="146.4" cy="187.6" r="3.5" class="ink-fill"/>
  <text x="138.4" y="73.6" class="txa b" text-anchor="end" font-size="15">L</text>
  <text x="184.4" y="65.6" class="tx b" font-size="15">R</text>
  <text x="186.4" y="192.6" class="txw b" font-size="15">D</text>
  <text x="138.4" y="204.6" class="tx2" text-anchor="end">CP</text>
  <text x="16" y="276" class="tx"><tspan class="b">R = L + D</tspan>: resultante de las presiones</text>
  <text x="16" y="296" class="txa"><tspan class="b">L</tspan> sustentación: perpendicular al viento</text>
  <text x="16" y="316" class="txw"><tspan class="b">D</tspan> resistencia: paralela al viento relativo</text>
  <text x="16" y="340" class="tx2">Sin escala: la resistencia está exagerada.</text>
  <text x="480" y="26" class="tx b" text-anchor="middle">En ascenso</text>
  <line x1="314.6" y1="180.4" x2="584.6" y2="180.4" class="ln2 dash"/>
  <path d="M100 130 C125 70 250 58 380 76 C460 87 520 108 560 130 C490 136 390 142 290 146 C200 149 130 148 100 130 Z" class="ac" transform="translate(478 196) rotate(25) scale(0.4) translate(-330 -130)"/>
  <line x1="444.6" y1="210.4" x2="444.6" y2="50.4" class="ln2 dash"/>
  <line x1="444.6" y1="180.4" x2="570.2" y2="214.1" class="ln2 dash"/>
  <line x1="334.7" y1="141.1" x2="377.2" y2="152.5" class="ln" marker-end="url(#080-resultante-k)"/>
  <text x="332.7" y="129.1" class="tx2">viento relativo</text>
  <line x1="444.6" y1="180.4" x2="475.7" y2="64.5" class="ac-ln thick" marker-end="url(#080-resultante-a)"/>
  <line x1="444.6" y1="180.4" x2="475.6" y2="188.7" class="wa-ln thick" marker-end="url(#080-resultante-w)"/>
  <circle cx="444.6" cy="180.4" r="3.5" class="ink-fill"/>
  <text x="482.7" y="70.5" class="txa b" font-size="15">L</text>
  <text x="481.6" y="204.7" class="txw b" font-size="15">D</text>
  <path d="M444.6 114.4 A66 66 0 0 1 461.7 116.7" class="ln"/>
  <text x="430.6" y="116.4" class="tx b" font-size="14" text-anchor="end">γ</text>
  <path d="M548.6 180.4 A104 104 0 0 1 545.1 207.4" class="ln"/>
  <text x="556.6" y="197.4" class="tx b" font-size="14">γ</text>
  <text x="584.6" y="173.4" class="tx2" text-anchor="end">horizonte</text>
  <text x="564.7" y="226.5" class="tx2">trayectoria</text>
  <text x="450.6" y="46.4" class="tx2">vertical</text>
  <text x="338" y="276" class="tx">La sustentación es perpendicular a la</text>
  <text x="338" y="296" class="tx">trayectoria de vuelo, no al horizonte:</text>
  <text x="338" y="316" class="tx">en ascenso queda inclinada hacia atrás</text>
  <text x="338" y="336" class="tx">el mismo ángulo γ de la trayectoria.</text>
</svg>
