<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
  <title>Masas de aire que llegan a la Península Ibérica según su procedencia: polar marítima, ártica marítima, polar continental, tropical marítima y tropical continental</title>
  <defs>
    <marker id="050-masas-flecha-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
    <marker id="050-masas-flecha-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ok-fill"/></marker>
    <marker id="050-masas-flecha-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="380" class="sky"/>
  <!-- Península -->
  <rect x="265" y="160" width="110" height="64" rx="10" class="ground"/>
  <text x="320" y="188" class="tx b" text-anchor="middle">Península</text>
  <text x="320" y="206" class="tx" text-anchor="middle">Ibérica</text>
  <!-- mA norte -->
  <line x1="320" y1="78" x2="320" y2="152" class="ac-ln thick" marker-end="url(#050-masas-flecha-a)"/>
  <text x="332" y="50" class="txa b" text-anchor="middle">mA ártica marítima</text>
  <text x="332" y="66" class="tx2" text-anchor="middle" font-size="12">muy fría, chubascos de nieve</text>
  <!-- mP noroeste -->
  <line x1="120" y1="86" x2="258" y2="156" class="ac-ln thick" marker-end="url(#050-masas-flecha-a)"/>
  <text x="26" y="64" class="txa b">mP polar marítima</text>
  <text x="26" y="80" class="tx2" font-size="12">fresca, inestable, chubascos</text>
  <!-- cP nordeste -->
  <line x1="520" y1="86" x2="382" y2="156" class="ac-ln thick" marker-end="url(#050-masas-flecha-a)"/>
  <text x="614" y="64" class="txa b" text-anchor="end">cP polar continental</text>
  <text x="614" y="80" class="tx2" font-size="12" text-anchor="end">fría y seca, invierno</text>
  <!-- mT suroeste -->
  <line x1="120" y1="300" x2="258" y2="228" class="ok-ln thick" marker-end="url(#050-masas-flecha-o)"/>
  <text x="26" y="326" class="txo b">mT tropical marítima</text>
  <text x="26" y="342" class="tx2" font-size="12">templada y húmeda: niebla, llovizna</text>
  <!-- cT sur -->
  <line x1="520" y1="300" x2="382" y2="228" class="wa-ln thick" marker-end="url(#050-masas-flecha-w)"/>
  <text x="614" y="326" class="txw b" text-anchor="end">cT tropical continental</text>
  <text x="614" y="342" class="tx2" font-size="12" text-anchor="end">cálida, seca, calima</text>
  <text x="320" y="368" class="tx2" text-anchor="middle" font-size="12">Mar y tierra dan la humedad; la latitud, la temperatura</text>
</svg>
