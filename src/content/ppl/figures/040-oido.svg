<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <title>Esquema del oído: oído externo, oído medio con trompa de Eustaquio y oído interno con cóclea y canales semicirculares</title>
  <rect x="20" y="20" width="150" height="260" rx="8" class="soft"/>
  <rect x="180" y="20" width="190" height="260" rx="8" class="ac"/>
  <rect x="380" y="20" width="240" height="260" rx="8" class="ok"/>
  <text x="95" y="44" class="tx b" text-anchor="middle">Oído externo</text>
  <text x="275" y="44" class="txa b" text-anchor="middle">Oído medio</text>
  <text x="500" y="44" class="txo b" text-anchor="middle">Oído interno</text>
  <path d="M30 150 C30 100 50 90 65 110 C72 128 60 150 74 160 L160 160" class="ln thick" fill="none"/>
  <text x="62" y="86" class="tx2" font-size="11" text-anchor="middle">pabellón</text>
  <text x="115" y="184" class="tx2" font-size="11" text-anchor="middle">conducto auditivo</text>
  <line x1="170" y1="130" x2="170" y2="190" class="wa-ln thick"/>
  <text x="112" y="120" class="txw b" font-size="11" text-anchor="middle">tímpano</text>
  <line x1="130" y1="124" x2="166" y2="140" class="ln2"/>
  <circle cx="205" cy="160" r="8" class="soft"/>
  <circle cx="240" cy="150" r="8" class="soft"/>
  <circle cx="275" cy="150" r="8" class="soft"/>
  <line x1="213" y1="158" x2="232" y2="152" class="ln"/>
  <line x1="248" y1="150" x2="267" y2="150" class="ln"/>
  <text x="240" y="130" class="tx2" font-size="11" text-anchor="middle">huesecillos</text>
  <path d="M230 200 C250 212 275 226 300 240" class="ln thick" fill="none"/>
  <text x="196" y="262" class="txa b" font-size="12">trompa de Eustaquio</text>
  <text x="196" y="276" class="tx2" font-size="11">hacia la garganta</text>
  <ellipse cx="420" cy="170" rx="30" ry="22" class="soft"/>
  <text x="420" y="174" class="tx2" font-size="11" text-anchor="middle">cóclea</text>
  <text x="420" y="205" class="tx2" font-size="11" text-anchor="middle">audición</text>
  <ellipse cx="515" cy="105" rx="45" ry="24" class="ln2" fill="none"/>
  <ellipse cx="560" cy="150" rx="22" ry="40" class="ln2" fill="none"/>
  <ellipse cx="500" cy="150" rx="22" ry="40" class="ln2" fill="none" transform="rotate(30 500 150)"/>
  <text x="500" y="68" class="txo b" font-size="12" text-anchor="middle">canales semicirculares</text>
  <text x="540" y="204" class="tx2" font-size="11" text-anchor="middle">giros (aceleración angular)</text>
  <circle cx="470" cy="224" r="9" class="wa"/>
  <text x="540" y="228" class="txw b" font-size="11" text-anchor="middle">otolitos</text>
  <text x="500" y="264" class="tx2" font-size="11" text-anchor="middle">aceleración lineal y gravedad</text>
  <text x="320" y="306" class="tx2" text-anchor="middle" font-size="11">El oído medio se equilibra con la garganta por la trompa de Eustaquio; el interno lleva audición y equilibrio</text>
</svg>
