<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<title>Esquema de un magneto: imán giratorio, circuito primario con platinos y condensador, transformador elevador, distribuidor y bujías</title>
<defs>
<marker id="020-magneto-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
</defs>
<rect x="14" y="60" width="104" height="64" class="soft"/>
<text x="66" y="84" class="tx b" text-anchor="middle">Imán</text>
<text x="66" y="102" class="tx2" font-size="11" text-anchor="middle">girado por</text><text x="66" y="115" class="tx2" font-size="11" text-anchor="middle">el motor</text>
<line x1="118" y1="92" x2="152" y2="92" class="ln thick" marker-end="url(#020-magneto-f)"/>
<rect x="156" y="60" width="124" height="64" class="ac"/>
<text x="218" y="84" class="txa b" text-anchor="middle">Primario</text>
<text x="218" y="102" class="tx2" font-size="11" text-anchor="middle">pocas espiras</text><text x="218" y="115" class="tx2" font-size="11" text-anchor="middle">(hilo grueso)</text>
<line x1="280" y1="92" x2="314" y2="92" class="ln thick" marker-end="url(#020-magneto-f)"/>
<rect x="318" y="60" width="124" height="64" class="wa"/>
<text x="380" y="84" class="txw b" text-anchor="middle">Secundario</text>
<text x="380" y="102" class="tx2" font-size="11" text-anchor="middle">muchas espiras</text><text x="380" y="115" class="tx2" font-size="11" text-anchor="middle">(alta tensión)</text>
<line x1="442" y1="92" x2="470" y2="92" class="wa-ln thick" marker-end="url(#020-magneto-f)"/>
<rect x="474" y="60" width="72" height="64" class="soft"/>
<text x="510" y="88" class="tx b" font-size="12" text-anchor="middle">Distri-</text>
<text x="510" y="104" class="tx b" font-size="12" text-anchor="middle">buidor</text>
<line x1="546" y1="92" x2="574" y2="92" class="wa-ln thick" marker-end="url(#020-magneto-f)"/>
<rect x="578" y="60" width="50" height="64" class="wa"/>
<text x="603" y="88" class="txw b" font-size="12" text-anchor="middle">Bujías</text>
<text x="603" y="104" class="tx2" font-size="11" text-anchor="middle">chispa</text>
<text x="300" y="46" class="tx2" font-size="12" text-anchor="middle">Transformador elevador</text>
<line x1="218" y1="124" x2="218" y2="178" class="ac-ln thick"/>
<rect x="30" y="178" width="170" height="64" class="ok"/>
<text x="115" y="204" class="txo b" text-anchor="middle">Platinos (ruptor)</text>
<text x="115" y="222" class="tx2" font-size="11" text-anchor="middle">los abre una leva del motor</text>
<line x1="200" y1="210" x2="218" y2="210" class="ac-ln thick"/>
<rect x="236" y="178" width="140" height="64" class="soft"/>
<text x="306" y="204" class="tx b" text-anchor="middle">Condensador</text>
<text x="306" y="222" class="tx2" font-size="11" text-anchor="middle">en paralelo con platinos</text>
<line x1="218" y1="210" x2="236" y2="210" class="ac-ln thick"/>
<line x1="406" y1="124" x2="406" y2="150" class="ln2 dash"/>
<line x1="218" y1="150" x2="406" y2="150" class="ln2 dash"/>
<rect x="396" y="178" width="232" height="64" class="soft"/>
<text x="512" y="204" class="tx b" text-anchor="middle">Interruptor de encendido</text>
<text x="512" y="222" class="tx2" font-size="11" text-anchor="middle">en OFF pone el primario a masa (cable P)</text>
<line x1="406" y1="150" x2="406" y2="178" class="ln2 dash"/>
<rect x="30" y="266" width="598" height="40" class="ok"/>
<text x="329" y="291" class="txo" text-anchor="middle">Al abrirse los platinos el primario se corta de golpe y salta la chispa en la bujía</text>
</svg>
