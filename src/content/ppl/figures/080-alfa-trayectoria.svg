<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468">
  <title>Ángulo de ataque, actitud y ángulo de trayectoria en vuelo nivelado, en ascenso y en descenso con el mismo ángulo de ataque</title>
  <defs>
    <marker id="080-alfa-trayectoria-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
  </defs>
  <line x1="14" y1="66" x2="340" y2="66" class="ln2 dash"/>
  <line x1="304.8" y1="79.5" x2="62.6" y2="36.8" class="ln dash"/>
  <g transform="translate(228 66) rotate(10) scale(1.3)">
    <path d="M-52 0 C-51 -7 -38 -10 -22 -10 L10 -10 C30 -9 44 -7 54 -5 L54 3 C44 5 30 6 10 7 L-22 7 C-38 7 -51 5 -52 0 Z" class="soft"/>
    <path d="M-30 -10 C-26 -17 -14 -18 -6 -10 Z" class="soft"/>
    <path d="M40 -6 L51 -26 L58 -26 L55 -5 Z" class="soft"/>
    <ellipse cx="50" cy="-1" rx="11" ry="2.2" class="soft"/>
    <path d="M100 130 C125 70 250 58 380 76 C460 87 520 108 560 130 C490 136 390 142 290 146 C200 149 130 148 100 130 Z" class="ac" transform="translate(-6 1) scale(0.1) translate(-330 -130)"/>
  </g>
  <line x1="228" y1="66" x2="52" y2="66" class="ln thick" marker-end="url(#080-alfa-trayectoria-k)"/>
  <circle cx="228" cy="66" r="3.2" class="ink-fill"/>
  <path d="M116 66 A112 112 0 0 1 117.7 46.6" class="ac-ln thick"/>
  <path d="M92 66 A136 136 0 0 1 94.1 42.4" class="wa-ln thick"/>
  <text x="114.4" y="76.2" class="txa b" font-size="15" text-anchor="middle">θ</text>
  <text x="80.5" y="50.1" class="txw b" font-size="15" text-anchor="middle">α</text>
  <text x="372" y="36" class="tx b">Vuelo nivelado</text>
  <text x="372" y="56" class="tx2"><tspan class="txo b">γ</tspan> = 0° · <tspan class="txa b">θ</tspan> = 10° · <tspan class="txw b">α</tspan> = 10°</text>
  <text x="372" y="80" class="tx">La actitud coincide con α</text>
  <text x="372" y="98" class="tx">porque la trayectoria es horizontal.</text>
  <line x1="16" y1="116" x2="624" y2="116" class="ln2"/>
  <line x1="14" y1="178" x2="340" y2="178" class="ln2 dash"/>
  <line x1="301.3" y1="204.7" x2="70.1" y2="120.5" class="ln dash"/>
  <g transform="translate(228 178) rotate(20) scale(1.3)">
    <path d="M-52 0 C-51 -7 -38 -10 -22 -10 L10 -10 C30 -9 44 -7 54 -5 L54 3 C44 5 30 6 10 7 L-22 7 C-38 7 -51 5 -52 0 Z" class="soft"/>
    <path d="M-30 -10 C-26 -17 -14 -18 -6 -10 Z" class="soft"/>
    <path d="M40 -6 L51 -26 L58 -26 L55 -5 Z" class="soft"/>
    <ellipse cx="50" cy="-1" rx="11" ry="2.2" class="soft"/>
    <path d="M100 130 C125 70 250 58 380 76 C460 87 520 108 560 130 C490 136 390 142 290 146 C200 149 130 148 100 130 Z" class="ac" transform="translate(-6 1) scale(0.1) translate(-330 -130)"/>
  </g>
  <line x1="228" y1="178" x2="54.7" y2="147.4" class="ln thick" marker-end="url(#080-alfa-trayectoria-k)"/>
  <circle cx="228" cy="178" r="3.2" class="ink-fill"/>
  <path d="M140 178 A88 88 0 0 1 141.3 162.7" class="ok-ln thick"/>
  <path d="M116 178 A112 112 0 0 1 122.8 139.7" class="ac-ln thick"/>
  <path d="M94.1 154.4 A136 136 0 0 1 100.2 131.5" class="wa-ln thick"/>
  <text x="138.3" y="190.3" class="txo b" font-size="15" text-anchor="middle">γ</text>
  <text x="115.7" y="178.6" class="txa b" font-size="15" text-anchor="middle">θ</text>
  <text x="84.6" y="138.8" class="txw b" font-size="15" text-anchor="middle">α</text>
  <text x="372" y="148" class="tx b">Ascenso</text>
  <text x="372" y="168" class="tx2"><tspan class="txo b">γ</tspan> = +10° · <tspan class="txa b">θ</tspan> = 20° · <tspan class="txw b">α</tspan> = 10°</text>
  <text x="372" y="192" class="tx">Morro más alto, pero el ala</text>
  <text x="372" y="210" class="tx">sigue con el mismo ángulo de ataque.</text>
  <line x1="16" y1="228" x2="624" y2="228" class="ln2"/>
  <line x1="14" y1="290" x2="340" y2="290" class="ln2 dash"/>
  <line x1="306" y1="290" x2="60" y2="290" class="ln dash"/>
  <g transform="translate(228 290) rotate(0) scale(1.3)">
    <path d="M-52 0 C-51 -7 -38 -10 -22 -10 L10 -10 C30 -9 44 -7 54 -5 L54 3 C44 5 30 6 10 7 L-22 7 C-38 7 -51 5 -52 0 Z" class="soft"/>
    <path d="M-30 -10 C-26 -17 -14 -18 -6 -10 Z" class="soft"/>
    <path d="M40 -6 L51 -26 L58 -26 L55 -5 Z" class="soft"/>
    <ellipse cx="50" cy="-1" rx="11" ry="2.2" class="soft"/>
    <path d="M100 130 C125 70 250 58 380 76 C460 87 520 108 560 130 C490 136 390 142 290 146 C200 149 130 148 100 130 Z" class="ac" transform="translate(-6 1) scale(0.1) translate(-330 -130)"/>
  </g>
  <line x1="228" y1="290" x2="54.7" y2="320.6" class="ln thick" marker-end="url(#080-alfa-trayectoria-k)"/>
  <circle cx="228" cy="290" r="3.2" class="ink-fill"/>
  <path d="M140 290 A88 88 0 0 0 141.3 305.3" class="ok-ln thick"/>
  <path d="M94.1 313.6 A136 136 0 0 1 92 290" class="wa-ln thick"/>
  <text x="138.3" y="319.7" class="txo b" font-size="15" text-anchor="middle">γ</text>
  <text x="80.5" y="323.9" class="txw b" font-size="15" text-anchor="middle">α</text>
  <text x="372" y="260" class="tx b">Descenso</text>
  <text x="372" y="280" class="tx2"><tspan class="txo b">γ</tspan> = −10° · <tspan class="txa b">θ</tspan> = 0° · <tspan class="txw b">α</tspan> = 10°</text>
  <text x="372" y="304" class="tx">Morro en el horizonte y el avión</text>
  <text x="372" y="322" class="tx">desciende: el mismo α de antes.</text>
  <line x1="16" y1="338" x2="624" y2="338" class="ln2"/>
  <text x="20" y="360" class="tx"><tspan class="txo b">γ</tspan> trayectoria: entre la trayectoria de vuelo (flecha) y el horizonte</text>
  <text x="20" y="380" class="tx"><tspan class="txa b">θ</tspan> actitud de cabeceo: entre el eje longitudinal (trazos) y el horizonte</text>
  <text x="20" y="400" class="tx"><tspan class="txw b">α</tspan> ángulo de ataque: entre el eje del ala y la trayectoria</text>
  <text x="20" y="426" class="tx b">α = θ − γ   (con calaje cero; con calaje i del ala, α = θ + i − γ)</text>
  <text x="20" y="446" class="tx2">Ángulos exagerados. En los tres casos el α y la velocidad son prácticamente los mismos:</text>
  <text x="20" y="463" class="tx2">lo que cambia al variar la potencia es la trayectoria.</text>
</svg>
