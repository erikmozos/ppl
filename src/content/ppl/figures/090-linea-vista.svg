<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <title>Alcance de la VHF en línea de vista: la aeronave alta mantiene la línea de vista con la estación, la baja queda oculta por el terreno, y el alcance crece con la raíz cuadrada de la altura</title>
  <rect x="0" y="0" width="640" height="320" class="sky"/>
  <path d="M0 270 L120 270 L215 230 L255 238 L330 270 L640 285 L640 320 L0 320 Z" class="ground"/>
  <path d="M0 270 L120 270 L215 230 L255 238 L330 270 L640 285" class="ln thick" fill="none"/>
  <line x1="60" y1="270" x2="60" y2="228" class="ln thick"/>
  <line x1="50" y1="228" x2="70" y2="228" class="ln thick"/>
  <text x="60" y="296" class="tx b" text-anchor="middle">Estación</text>
  <text x="60" y="312" class="tx2" font-size="11" text-anchor="middle">de tierra</text>
  <line x1="60" y1="228" x2="470" y2="74" class="ok-ln dash"/>
  <path d="M440 70 L500 70 M470 62 L470 80 M462 80 L478 80" class="ln thick" fill="none"/>
  <text x="470" y="50" class="txo b" text-anchor="middle">Alta: hay línea de vista</text>
  <path d="M300 250 L360 250 M330 242 L330 260 M322 260 L338 260" class="ln thick" fill="none"/>
  <line x1="60" y1="228" x2="212" y2="230" class="wa-ln dash"/>
  <text x="330" y="212" class="txw b" text-anchor="middle">Baja: tapada por el monte</text>
  <text x="330" y="228" class="tx2" font-size="11" text-anchor="middle">sin contacto</text>
  <line x1="470" y1="92" x2="470" y2="276" class="ln2"/>
  <text x="462" y="180" class="tx2" text-anchor="end">h</text>
  <rect x="486" y="110" width="148" height="116" rx="8" class="soft"/>
  <text x="560" y="130" class="tx b" text-anchor="middle">Alcance (NM)</text>
  <text x="560" y="147" class="tx b" text-anchor="middle">≈ 1,23 × √h (ft)</text>
  <text x="498" y="168" class="tx2">1000 ft: 39 NM</text>
  <text x="498" y="184" class="tx2">2500 ft: 61 NM</text>
  <text x="498" y="200" class="tx2">5000 ft: 87 NM</text>
  <text x="498" y="216" class="tx2">10 000 ft: 123 NM</text>
</svg>
