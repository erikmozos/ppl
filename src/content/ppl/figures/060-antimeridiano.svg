<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>Cruzar el antimeridiano a 60° N: de 160° E, 900 NM hacia el este son 30° de longitud y se llega a 170° O</title>
  <defs>
    <marker id="060-antimeridiano-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
  </defs>
  <line x1="30" y1="150" x2="610" y2="150" class="ln2"/>
  <line x1="100" y1="144" x2="100" y2="156" class="ln"/>
  <line x1="190" y1="144" x2="190" y2="156" class="ln"/>
  <line x1="280" y1="144" x2="280" y2="156" class="ln"/>
  <line x1="460" y1="144" x2="460" y2="156" class="ln"/>
  <line x1="550" y1="144" x2="550" y2="156" class="ln"/>
  <line x1="370" y1="40" x2="370" y2="200" class="wa-ln dash thick"/>
  <text x="370" y="30" class="txw b" text-anchor="middle">180° (antimeridiano)</text>
  <text x="370" y="216" class="txw" text-anchor="middle">aquí E pasa a O</text>
  <text x="100" y="176" class="tx" text-anchor="middle">150° E</text>
  <text x="190" y="176" class="tx" text-anchor="middle">160° E</text>
  <text x="280" y="176" class="tx" text-anchor="middle">170° E</text>
  <text x="460" y="176" class="tx" text-anchor="middle">170° O</text>
  <text x="550" y="176" class="tx" text-anchor="middle">160° O</text>
  <circle cx="190" cy="150" r="6" class="ac-fill"/>
  <circle cx="460" cy="150" r="6" class="ok-fill"/>
  <text x="190" y="136" class="txa b" text-anchor="middle">A</text>
  <text x="460" y="136" class="txo b" text-anchor="middle">B</text>
  <path d="M200 106 L450 106" class="ac-ln thick" fill="none" marker-end="url(#060-antimeridiano-f)"/>
  <text x="325" y="96" class="txa b" text-anchor="middle">900 NM al este = 30° de longitud</text>
  <text x="320" y="248" class="tx" text-anchor="middle">60° N: 900 NM ÷ cos 60° = 1800′ = 30°; 160° E + 30° = 190° E = 170° O</text>
  <text x="320" y="270" class="tx2" text-anchor="middle">Si pasas de 180°, resta de 360° y cambia E por O</text>
</svg>
