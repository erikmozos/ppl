<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350">
<title>Lubricación por cárter húmedo y por cárter seco: dónde se guarda el aceite y qué bombas lo mueven</title>
<defs>
<marker id="020-carter-seco-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
</defs>
<line x1="320" y1="14" x2="320" y2="340" class="ln2 dash"/>
<text x="160" y="28" class="tx b" text-anchor="middle">Cárter húmedo</text>
<text x="480" y="28" class="tx b" text-anchor="middle">Cárter seco</text>
<rect x="50" y="52" width="220" height="110" class="soft"/>
<text x="160" y="96" class="tx" text-anchor="middle">Motor</text>
<path d="M50 162 H270 V216 H50 Z" class="ac"/>
<text x="160" y="194" class="txa" text-anchor="middle">Aceite en el cárter</text>
<circle cx="160" cy="246" r="16" class="ok"/>
<text x="160" y="251" class="txo b" font-size="12" text-anchor="middle">B</text>
<path d="M176 246 H298 V110 H272" class="ac-ln thick" fill="none" marker-end="url(#020-carter-seco-f)"/>
<line x1="160" y1="216" x2="160" y2="230" class="ac-ln thick"/>
<text x="160" y="286" class="tx2" font-size="12" text-anchor="middle">Una sola bomba (B) aspira del cárter</text>
<text x="160" y="308" class="tx2" font-size="11" text-anchor="middle">El aceite se desplaza con las maniobras y la</text>
<text x="160" y="323" class="tx2" font-size="11" text-anchor="middle">capacidad queda limitada por el cárter</text>
<rect x="345" y="52" width="200" height="88" class="soft"/>
<text x="445" y="92" class="tx" text-anchor="middle">Motor</text>
<rect x="345" y="140" width="200" height="22" class="soft"/>
<text x="445" y="155" class="tx2" font-size="11" text-anchor="middle">cárter casi vacío</text>
<circle cx="390" cy="232" r="17" class="wa"/>
<text x="390" y="237" class="txw b" font-size="12" text-anchor="middle">R</text>
<line x1="390" y1="162" x2="390" y2="213" class="ac-ln thick" marker-end="url(#020-carter-seco-f)"/>
<rect x="440" y="204" width="100" height="56" class="ac"/>
<text x="490" y="228" class="txa b" font-size="12" text-anchor="middle">Depósito</text>
<text x="490" y="244" class="tx2" font-size="11" text-anchor="middle">de aceite</text>
<line x1="407" y1="232" x2="438" y2="232" class="ac-ln thick" marker-end="url(#020-carter-seco-f)"/>
<circle cx="596" cy="232" r="17" class="ok"/>
<text x="596" y="237" class="txo b" font-size="12" text-anchor="middle">P</text>
<line x1="542" y1="232" x2="577" y2="232" class="ac-ln thick" marker-end="url(#020-carter-seco-f)"/>
<path d="M596 214 V100 H547" class="ac-ln thick" fill="none" marker-end="url(#020-carter-seco-f)"/>
<text x="390" y="198" class="txw" font-size="11" text-anchor="middle">recupera</text>
<text x="596" y="272" class="txo" font-size="11" text-anchor="middle">presión</text>
<text x="480" y="298" class="tx2" font-size="12" text-anchor="middle">R barre el cárter y devuelve el aceite al depósito;</text>
<text x="480" y="314" class="tx2" font-size="12" text-anchor="middle">P lo impulsa a presión hacia el motor.</text>
<text x="480" y="334" class="txw" font-size="12" text-anchor="middle">R mueve un 25-50 % más caudal que P</text>
</svg>
