<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298">
  <title>Ilusiones de aproximación: pista estrecha, ancha, en pendiente ascendente y descendente, con la trayectoria correcta y la volada</title>
  <rect x="10" y="14" width="148" height="196" rx="6" class="soft"/>
  <line x1="20" y1="172" x2="148" y2="172" class="ln2"/>
  <line x1="98" y1="172" x2="148" y2="172" class="ln thick"/>
  <path d="M22 70 L98 172" class="ok-ln dash thick" fill="none"/>
  <path d="M22 112 L98 172" class="wa-ln thick" fill="none"/>
  <text x="84" y="232" class="tx b" font-size="12" text-anchor="middle">Pista estrecha o larga</text>
  <text x="84" y="248" class="tx2" font-size="11" text-anchor="middle">parece que estás alto</text>
  <text x="84" y="264" class="txw b" font-size="11" text-anchor="middle">aproximación baja</text>
  <rect x="116" y="30" width="8" height="48" class="ac"/>
  <text x="120" y="92" class="tx2" font-size="10" text-anchor="middle">planta</text>
  <rect x="168" y="14" width="148" height="196" rx="6" class="soft"/>
  <line x1="178" y1="172" x2="306" y2="172" class="ln2"/>
  <line x1="256" y1="172" x2="306" y2="172" class="ln thick"/>
  <path d="M180 70 L256 172" class="ok-ln dash thick" fill="none"/>
  <path d="M180 36 L256 172" class="wa-ln thick" fill="none"/>
  <text x="242" y="232" class="tx b" font-size="12" text-anchor="middle">Pista ancha o corta</text>
  <text x="242" y="248" class="tx2" font-size="11" text-anchor="middle">parece que estás bajo</text>
  <text x="242" y="264" class="txw b" font-size="11" text-anchor="middle">aproximación alta</text>
  <rect x="260" y="40" width="30" height="24" class="ac"/>
  <text x="275" y="78" class="tx2" font-size="10" text-anchor="middle">planta</text>
  <rect x="326" y="14" width="148" height="196" rx="6" class="soft"/>
  <line x1="336" y1="172" x2="414" y2="172" class="ln2"/>
  <line x1="414" y1="172" x2="464" y2="150" class="ln thick"/>
  <path d="M338 70 L414 172" class="ok-ln dash thick" fill="none"/>
  <path d="M338 112 L414 172" class="wa-ln thick" fill="none"/>
  <text x="400" y="232" class="tx b" font-size="12" text-anchor="middle">Pendiente ascendente</text>
  <text x="400" y="248" class="tx2" font-size="11" text-anchor="middle">parece que estás alto</text>
  <text x="400" y="264" class="txw b" font-size="11" text-anchor="middle">aproximación baja</text>
  <rect x="484" y="14" width="148" height="196" rx="6" class="soft"/>
  <line x1="494" y1="150" x2="572" y2="150" class="ln2"/>
  <line x1="572" y1="150" x2="622" y2="172" class="ln thick"/>
  <path d="M496 70 L572 150" class="ok-ln dash thick" fill="none"/>
  <path d="M496 36 L572 150" class="wa-ln thick" fill="none"/>
  <text x="558" y="232" class="tx b" font-size="12" text-anchor="middle">Pendiente descendente</text>
  <text x="558" y="248" class="tx2" font-size="11" text-anchor="middle">parece que estás bajo</text>
  <text x="558" y="264" class="txw b" font-size="11" text-anchor="middle">aproximación alta</text>
  <line x1="170" y1="284" x2="200" y2="284" class="ok-ln dash thick"/><text x="206" y="288" class="tx2" font-size="11">trayectoria correcta</text>
  <line x1="350" y1="284" x2="380" y2="284" class="wa-ln thick"/><text x="386" y="288" class="tx2" font-size="11">trayectoria volada por la ilusión</text>
</svg>
