  <text x="320" y="30" class="tx b" text-anchor="middle">OBS en 360°. Cada punto del CDI son 2°; el extremo, 10°</text>
  <text x="320" y="260" class="tx2" text-anchor="middle">El CDI no depende del rumbo del avión: depende de la posición respecto al radial</text>
