<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<title>Instrumentos giroscópicos: horizonte artificial, direccional y coordinador de viraje con su eje y su alimentación</title>
<path d="M40 100 A70 70 0 0 1 180 100 Z" class="sky"/>
<path d="M40 100 A70 70 0 0 0 180 100 Z" class="ground"/>
<circle cx="110" cy="100" r="70" class="ln" fill="none"/>
<line x1="40" y1="100" x2="180" y2="100" class="ln thick"/>
<line x1="70" y1="106" x2="150" y2="106" class="wa-ln thick"/>
<circle cx="110" cy="106" r="4" class="wa-fill"/>
<circle cx="320" cy="100" r="70" class="soft"/>
<text x="320" y="46" class="tx b" text-anchor="middle">N</text>
<text x="320" y="164" class="tx b" text-anchor="middle">S</text>
<text x="262" y="105" class="tx b" text-anchor="middle">O</text>
<text x="378" y="105" class="tx b" text-anchor="middle">E</text>
<path d="M320 82 L330 112 L320 106 L310 112 Z" class="wa-fill"/>
<circle cx="530" cy="100" r="70" class="soft"/>
<line x1="480" y1="100" x2="580" y2="100" class="wa-ln thick"/>
<line x1="530" y1="100" x2="530" y2="78" class="wa-ln thick"/>
<line x1="510" y1="94" x2="550" y2="94" class="wa-ln thick"/>
<text x="488" y="132" class="tx2" font-size="11">I</text>
<text x="572" y="132" class="tx2" font-size="11">D</text>
<text x="530" y="150" class="tx2" font-size="11" text-anchor="middle">2 MIN</text>
<rect x="480" y="186" width="100" height="22" class="soft"/>
<circle cx="530" cy="197" r="8" class="ln"/>
<line x1="525" y1="186" x2="525" y2="208" class="ln2"/>
<line x1="535" y1="186" x2="535" y2="208" class="ln2"/>
<text x="110" y="196" class="tx b" text-anchor="middle">Horizonte artificial</text>
<text x="110" y="214" class="tx2" font-size="11" text-anchor="middle">Rotor de eje vertical</text>
<text x="110" y="228" class="tx2" font-size="11" text-anchor="middle">2 grados de libertad</text>
<text x="110" y="242" class="tx2" font-size="11" text-anchor="middle">Vacío (4,5 a 5,5 inHg)</text>
<text x="320" y="196" class="tx b" text-anchor="middle">Direccional</text>
<text x="320" y="214" class="tx2" font-size="11" text-anchor="middle">Rotor de eje horizontal</text>
<text x="320" y="228" class="tx2" font-size="11" text-anchor="middle">2 grados de libertad</text>
<text x="320" y="242" class="tx2" font-size="11" text-anchor="middle">Vacío; se alinea con la brújula</text>
<text x="530" y="236" class="tx b" text-anchor="middle">Coordinador de viraje</text>
<text x="530" y="254" class="tx2" font-size="11" text-anchor="middle">Eje inclinado unos 30°</text>
<text x="530" y="268" class="tx2" font-size="11" text-anchor="middle">1 grado de libertad</text>
<text x="530" y="282" class="tx2" font-size="11" text-anchor="middle">Eléctrico; con bola de coordinación</text>
<text x="320" y="312" class="tx2" font-size="11" text-anchor="middle">Si falla el vacío, los dos primeros pierden la referencia; el coordinador sigue funcionando.</text>
</svg>
