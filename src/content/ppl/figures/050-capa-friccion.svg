<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
<title>Capa de fricción de día y de noche: de día las térmicas la ensanchan hasta 2000-3000 ft; de noche una inversión baja separa un viento flojo de otro fuerte y crea cizalladura (esquema propio)</title>
<defs><marker id="050-capa-friccion-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
<marker id="050-capa-friccion-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
<marker id="050-capa-friccion-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker></defs>
<rect x="10" y="10" width="300" height="320" rx="8" class="sky"/>
<text x="160" y="32" class="tx b" text-anchor="middle">De día</text>
<rect x="10" y="296" width="300" height="34" class="ground"/>
<rect x="330" y="10" width="300" height="320" rx="8" class="sky"/>
<text x="480" y="32" class="tx b" text-anchor="middle">De noche</text>
<rect x="330" y="296" width="300" height="34" class="ground"/>
<rect x="10" y="96" width="300" height="200" class="soft"/>
<line x1="10" y1="96" x2="310" y2="96" class="ln dash"/><text x="20" y="90" class="tx2" font-size="11">≈ 3000 ft</text>
<line x1="60" y1="288" x2="60" y2="130" class="wa-ln thick" marker-end="url(#050-capa-friccion-w)"/>
<line x1="120" y1="288" x2="120" y2="130" class="wa-ln thick" marker-end="url(#050-capa-friccion-w)"/>
<line x1="180" y1="288" x2="180" y2="130" class="wa-ln thick" marker-end="url(#050-capa-friccion-w)"/>
<line x1="240" y1="288" x2="240" y2="130" class="wa-ln thick" marker-end="url(#050-capa-friccion-w)"/>
<line x1="90" y1="130" x2="90" y2="280" class="ac-ln" marker-end="url(#050-capa-friccion-a)"/>
<line x1="150" y1="130" x2="150" y2="280" class="ac-ln" marker-end="url(#050-capa-friccion-a)"/>
<line x1="210" y1="130" x2="210" y2="280" class="ac-ln" marker-end="url(#050-capa-friccion-a)"/>
<line x1="270" y1="130" x2="270" y2="280" class="ac-ln" marker-end="url(#050-capa-friccion-a)"/>
<text x="160" y="316" class="tx b" text-anchor="middle" font-size="12">térmicas + rozamiento</text>
<text x="160" y="60" class="tx2" font-size="12" text-anchor="middle">capa inestable y gruesa</text>
<line x1="330" y1="230" x2="630" y2="230" class="wa-ln thick dash"/><text x="340" y="224" class="txw b" font-size="12">inversión</text>
<line x1="350" y1="150" x2="470" y2="150" class="ln thick" marker-end="url(#050-capa-friccion-f)"/><line x1="350" y1="180" x2="470" y2="180" class="ln thick" marker-end="url(#050-capa-friccion-f)"/>
<line x1="480" y1="270" x2="520" y2="282" class="ln" marker-end="url(#050-capa-friccion-f)"/><line x1="550" y1="262" x2="590" y2="266" class="ln" marker-end="url(#050-capa-friccion-f)"/>
<text x="560" y="164" class="tx2" font-size="12" text-anchor="middle">viento fuerte</text><text x="560" y="180" class="tx2" font-size="12" text-anchor="middle">y de otra dirección</text>
<text x="400" y="256" class="tx2" font-size="12" text-anchor="middle">viento flojo</text>
<ellipse cx="560" cy="230" rx="44" ry="12" class="wa"/><text x="560" y="234" class="txw b" text-anchor="middle" font-size="12">cizalladura</text>
<text x="480" y="316" class="tx b" text-anchor="middle" font-size="12">solo turbulencia mecánica</text>
<text x="480" y="60" class="tx2" font-size="12" text-anchor="middle">capa estable y delgada</text>
</svg>