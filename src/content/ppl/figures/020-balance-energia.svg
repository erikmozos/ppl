<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
<title>Reparto de la energía del combustible en un motor de pistón: trabajo útil, gases de escape y calor del motor</title>
<rect x="30" y="50" width="162" height="70" class="ok"/>
<rect x="192" y="50" width="256" height="70" class="soft"/>
<rect x="448" y="50" width="162" height="70" class="wa"/>
<text x="111" y="80" class="txo b" text-anchor="middle">25-28 %</text>
<text x="111" y="100" class="tx2" font-size="12" text-anchor="middle">trabajo útil</text>
<text x="320" y="80" class="tx b" text-anchor="middle">40 %</text>
<text x="320" y="100" class="tx2" font-size="12" text-anchor="middle">se va por el escape</text>
<text x="529" y="80" class="txw b" text-anchor="middle">32 %</text>
<text x="529" y="100" class="tx2" font-size="12" text-anchor="middle">calor del motor</text>
<text x="30" y="36" class="tx b">100 % de la energía del combustible</text>
<line x1="529" y1="120" x2="529" y2="160" class="wa-ln"/>
<rect x="400" y="160" width="210" height="76" class="soft"/>
<text x="505" y="182" class="tx b" text-anchor="middle">Hay que evacuarlo</text>
<text x="505" y="200" class="tx2" font-size="12" text-anchor="middle">aire por las aletas, aceite,</text>
<text x="505" y="216" class="tx2" font-size="12" text-anchor="middle">líquido refrigerante</text>
<line x1="111" y1="120" x2="111" y2="160" class="ok-ln"/>
<text x="111" y="182" class="txo" text-anchor="middle">Mueve la hélice</text>
<text x="111" y="200" class="tx2" font-size="12" text-anchor="middle">y los accesorios</text>
<text x="320" y="262" class="tx2" font-size="11" text-anchor="middle">Cifras aproximadas del curso: la suma da el 100 %</text>
</svg>
