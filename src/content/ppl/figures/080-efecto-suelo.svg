<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <title>Efecto suelo: el suelo reduce el downwash y los torbellinos de punta cuando el ala vuela a menos de una envergadura de altura</title>
  <defs>
    <marker id="080-efecto-suelo-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
    <marker id="080-efecto-suelo-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
    <marker id="080-efecto-suelo-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="300" class="sky"/>
  <rect x="0" y="300" width="640" height="30" class="ground"/>
  <line x1="320" y1="10" x2="320" y2="300" class="ln2 dash"/>
  <text x="160" y="28" class="tx b" text-anchor="middle">fuera del efecto suelo</text>
  <text x="160" y="44" class="tx2" text-anchor="middle">altura mayor que una envergadura</text>
  <line x1="50" y1="100" x2="270" y2="100" class="ln thick"/>
  <circle cx="160" cy="100" r="12" class="soft"/>
  <path d="M50 132 A32 32 0 1 1 82 100" class="wa-ln thick" fill="none" marker-end="url(#080-efecto-suelo-w)"/>
  <path d="M270 132 A32 32 0 1 0 238 100" class="wa-ln thick" fill="none" marker-end="url(#080-efecto-suelo-w)"/>
  <line x1="110" y1="118" x2="110" y2="178" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="140" y1="118" x2="140" y2="186" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="180" y1="118" x2="180" y2="186" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="210" y1="118" x2="210" y2="178" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <text x="160" y="210" class="txa b" text-anchor="middle">downwash intenso</text>
  <text x="160" y="226" class="tx2" text-anchor="middle">torbellinos grandes</text>
  <text x="160" y="242" class="tx2" text-anchor="middle">más resistencia inducida</text>
  <text x="480" y="28" class="tx b" text-anchor="middle">en efecto suelo</text>
  <text x="480" y="44" class="tx2" text-anchor="middle">altura menor que media envergadura</text>
  <text x="480" y="110" class="txa b" text-anchor="middle">downwash y torbellinos</text>
  <text x="480" y="126" class="txa b" text-anchor="middle">frenados por el suelo</text>
  <text x="480" y="148" class="tx2" text-anchor="middle">menos resistencia inducida</text>
  <text x="480" y="164" class="tx2" text-anchor="middle">más CL con el mismo α: el avión flota</text>
  <line x1="370" y1="250" x2="590" y2="250" class="ln thick"/>
  <circle cx="480" cy="250" r="12" class="soft"/>
  <ellipse cx="372" cy="262" rx="16" ry="11" class="wa-ln thick" fill="none"/>
  <ellipse cx="588" cy="262" rx="16" ry="11" class="wa-ln thick" fill="none"/>
  <line x1="430" y1="262" x2="430" y2="282" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="460" y1="262" x2="460" y2="285" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="500" y1="262" x2="500" y2="285" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="530" y1="262" x2="530" y2="282" class="ac-ln" marker-end="url(#080-efecto-suelo-a)"/>
  <line x1="612" y1="252" x2="612" y2="298" class="ln" marker-start="url(#080-efecto-suelo-k)" marker-end="url(#080-efecto-suelo-k)"/>
  <text x="604" y="236" class="tx b" text-anchor="middle">h</text>
  <line x1="370" y1="214" x2="590" y2="214" class="ln2" marker-start="url(#080-efecto-suelo-k)" marker-end="url(#080-efecto-suelo-k)"/>
  <text x="480" y="206" class="tx" text-anchor="middle">envergadura b</text>
  <text x="20" y="352" class="tx">Se nota por debajo de una envergadura de altura y es fuerte por debajo de media.</text>
  <text x="20" y="372" class="tx">Al salir de él vuelve la inducida: hay que aumentar α y el avión puede hundirse.</text>
  <text x="20" y="392" class="tx2">Esquema visto desde atrás; proporciones exageradas.</text>
</svg>
