<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370">
<title>Código de estado de pista RWYCC de 6 a 0 con la condición y la eficacia de frenado de cada código</title>
<text x="20" y="28" class="tx b">Código de estado de pista (RWYCC), formato global de notificación</text>
<rect x="20" y="44" width="56" height="36" class="ok"/>
<text x="48" y="69" class="tx b" font-size="18" text-anchor="middle">6</text>
<rect x="84" y="44" width="536" height="36" class="soft"/>
<text x="94" y="67" class="tx">Seca</text>
<rect x="20" y="88" width="56" height="36" class="ok"/>
<text x="48" y="113" class="tx b" font-size="18" text-anchor="middle">5</text>
<rect x="84" y="88" width="536" height="36" class="soft"/>
<text x="94" y="111" class="tx">Buena: escarcha, mojada o con agua o nieve fundente hasta 3 mm</text>
<rect x="20" y="132" width="56" height="36" class="soft"/>
<text x="48" y="157" class="tx b" font-size="18" text-anchor="middle">4</text>
<rect x="84" y="132" width="536" height="36" class="soft"/>
<text x="94" y="155" class="tx">Buena a media: nieve compactada a −15 °C o menos</text>
<rect x="20" y="176" width="56" height="36" class="soft"/>
<text x="48" y="201" class="tx b" font-size="18" text-anchor="middle">3</text>
<rect x="84" y="176" width="536" height="36" class="soft"/>
<text x="94" y="199" class="tx">Media: mojada resbaladiza, nieve de más de 3 mm, nieve compactada a más de −15 °C</text>
<rect x="20" y="220" width="56" height="36" class="wa"/>
<text x="48" y="245" class="tx b" font-size="18" text-anchor="middle">2</text>
<rect x="84" y="220" width="536" height="36" class="soft"/>
<text x="94" y="243" class="tx">Media a mala: más de 3 mm de agua o nieve fundente</text>
<rect x="20" y="264" width="56" height="36" class="wa"/>
<text x="48" y="289" class="tx b" font-size="18" text-anchor="middle">1</text>
<rect x="84" y="264" width="536" height="36" class="soft"/>
<text x="94" y="287" class="tx">Mala: hielo</text>
<rect x="20" y="308" width="56" height="36" class="wa"/>
<text x="48" y="333" class="tx b" font-size="18" text-anchor="middle">0</text>
<rect x="84" y="308" width="536" height="36" class="soft"/>
<text x="94" y="331" class="tx">Menos que mala: hielo mojado, agua sobre nieve compactada</text>
<text x="20" y="364" class="tx2">Un código por cada tercio de pista (resumen de la matriz OACI).</text>
</svg>