<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290">
<title>Tres formas de compensación aerodinámica de una superficie de mando: bisagra retrasada, horn e interna (vista en planta, esquema propio)</title>
<defs>
<marker id="020-compensacion-aerodinamica-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
</defs>
<line x1="12" y1="28" x2="68" y2="28" class="ln thick" marker-end="url(#020-compensacion-aerodinamica-f)"/>
<text x="76" y="32" class="tx2" font-size="11">viento relativo</text>
<text x="320" y="282" class="tx2" font-size="11" text-anchor="middle">Vista en planta: parte fija a la izquierda, superficie de mando a la derecha</text>

<rect x="10" y="60" width="70" height="110" class="soft"/>
<rect x="80" y="60" width="110" height="110" class="ac"/>
<rect x="80" y="60" width="18" height="110" class="wa"/>
<line x1="98" y1="52" x2="98" y2="178" class="ln thick dash"/>
<text x="98" y="196" class="tx2" font-size="11" text-anchor="middle">bisagra</text>
<text x="45" y="120" class="tx2" font-size="11" text-anchor="middle">fijo</text>
<text x="144" y="120" class="tx" text-anchor="middle">mando</text>
<text x="89" y="214" class="tx b" text-anchor="middle">Bisagra retrasada</text>
<text x="100" y="231" class="tx2" font-size="11" text-anchor="middle">La parte delantera (roja)</text>
<text x="100" y="245" class="tx2" font-size="11" text-anchor="middle">tira en contra y acorta</text>
<text x="100" y="259" class="tx2" font-size="11" text-anchor="middle">el brazo de la fuerza</text>

<rect x="225" y="60" width="70" height="110" class="soft"/>
<rect x="295" y="60" width="110" height="110" class="ac"/>
<rect x="273" y="60" width="22" height="42" class="wa"/>
<line x1="295" y1="52" x2="295" y2="178" class="ln thick dash"/>
<text x="295" y="196" class="tx2" font-size="11" text-anchor="middle">bisagra</text>
<text x="260" y="136" class="tx2" font-size="11" text-anchor="middle">fijo</text>
<text x="350" y="120" class="tx" text-anchor="middle">mando</text>
<text x="262" y="82" class="txw" font-size="11" text-anchor="end">horn</text>
<text x="315" y="214" class="tx b" text-anchor="middle">Horn balance</text>
<text x="315" y="231" class="tx2" font-size="11" text-anchor="middle">Un saliente por delante de la</text>
<text x="315" y="245" class="tx2" font-size="11" text-anchor="middle">bisagra crea un momento opuesto</text>
<text x="315" y="259" class="tx2" font-size="11" text-anchor="middle">(timón de dirección y elevador)</text>

<rect x="440" y="60" width="70" height="110" class="soft"/>
<rect x="510" y="60" width="110" height="110" class="ac"/>
<rect x="466" y="92" width="44" height="46" class="wa"/>
<line x1="466" y1="88" x2="510" y2="88" class="ln2"/>
<line x1="466" y1="142" x2="510" y2="142" class="ln2"/>
<line x1="510" y1="52" x2="510" y2="178" class="ln thick dash"/>
<text x="510" y="196" class="tx2" font-size="11" text-anchor="middle">bisagra</text>
<text x="458" y="76" class="tx2" font-size="11" text-anchor="middle">fijo</text>
<text x="565" y="120" class="tx" text-anchor="middle">mando</text>
<text x="488" y="119" class="txw" font-size="11" text-anchor="middle">panel</text>
<text x="530" y="214" class="tx b" text-anchor="middle">Compensación interna</text>
<text x="530" y="231" class="tx2" font-size="11" text-anchor="middle">Un panel sellado dentro del ala</text>
<text x="530" y="245" class="tx2" font-size="11" text-anchor="middle">aprovecha la diferencia de presión</text>
<text x="530" y="259" class="tx2" font-size="11" text-anchor="middle">(alerones de aviones grandes)</text>
</svg>
