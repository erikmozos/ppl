<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<title>Autonomía y alcance en calma del avión de ejemplo con 110 l utilizables y PA 4000 ft, al 55, 65 y 75 % de potencia</title>
