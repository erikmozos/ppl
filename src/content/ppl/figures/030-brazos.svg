  <path d="M250 96 C290 82 330 80 360 93 L330 98 L262 100 Z" class="sky"/>
  <path d="M220 152 C240 140 330 138 380 146 C340 158 250 160 220 152 Z" class="ac"/>
  <line x1="58" y1="112" x2="58" y2="144" class="ln thick"/>
  <rect x="264" y="104" width="24" height="24" rx="4" class="ok"/>
  <rect x="372" y="104" width="24" height="24" rx="4" class="ok"/>
  <rect x="438" y="112" width="30" height="20" rx="3" class="wa"/>
  <circle cx="314" cy="148" r="6" class="ac-fill"/>
  <circle cx="298" cy="126" r="9" class="bg-fill"/>
  <circle cx="298" cy="126" r="9" class="ln"/>
  <path d="M298 117 A9 9 0 0 1 307 126 L298 126 Z" class="ink-fill"/>
  <path d="M298 135 A9 9 0 0 1 289 126 L298 126 Z" class="ink-fill"/>
