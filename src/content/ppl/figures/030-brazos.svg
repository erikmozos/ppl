<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
  <title>Datum, brazos y momentos en el PA-28-161 de ejemplo: cada carga tiene su brazo medido desde el datum</title>
  <defs>
    <marker id="030-brazos-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
    <marker id="030-brazos-flecha-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
  </defs>
  <text x="620" y="24" class="tx b" text-anchor="end">Momento = masa × brazo</text>
  <text x="620" y="44" class="tx2" text-anchor="end">CG = suma de momentos / suma de masas</text>
  <line x1="44" y1="40" x2="44" y2="330" class="wa-ln dash"/>
  <text x="52" y="54" class="txw b">datum</text>
  <text x="52" y="70" class="tx2">brazo = 0</text>
