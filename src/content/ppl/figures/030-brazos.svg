  <line x1="298" y1="78" x2="298" y2="114" class="ln2"/>
  <text x="200" y="98" class="tx2" text-anchor="end">delanteros</text>
  <text x="404" y="98" class="tx2">traseros</text>
  <text x="474" y="160" class="tx2">equipaje</text>
  <text x="314" y="176" class="txa" text-anchor="middle">combustible (alas)</text>
  <line x1="276" y1="130" x2="276" y2="206" class="ln2 dash"/>
  <line x1="314" y1="180" x2="314" y2="236" class="ln2 dash"/>
  <line x1="384" y1="130" x2="384" y2="266" class="ln2 dash"/>
  <line x1="453" y1="134" x2="453" y2="296" class="ln2 dash"/>
  <line x1="44" y1="206" x2="274" y2="206" class="ln" marker-end="url(#030-brazos-flecha)"/>
  <text x="70" y="200" class="tx">asientos delanteros 2,05 m</text>
  <line x1="44" y1="236" x2="312" y2="236" class="ac-ln" marker-end="url(#030-brazos-flecha-a)"/>
  <text x="70" y="230" class="txa">combustible 2,40 m</text>
  <line x1="44" y1="266" x2="382" y2="266" class="ln" marker-end="url(#030-brazos-flecha)"/>
  <text x="70" y="260" class="tx">asientos traseros 3,00 m</text>
  <line x1="44" y1="296" x2="451" y2="296" class="wa-ln" marker-end="url(#030-brazos-flecha)"/>
  <text x="70" y="290" class="txw">equipaje 3,60 m</text>
  <line x1="40" y1="322" x2="8" y2="322" class="ln2" marker-end="url(#030-brazos-flecha)"/>
  <text x="52" y="326" class="tx2">por delante del datum el brazo es negativo; por detrás, positivo</text>
