<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
<title>Diagrama presión-volumen del ciclo Otto: ciclo teórico a volumen constante frente al ciclo real redondeado</title>
<defs>
<marker id="020-ciclo-pv-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
</defs>
<line x1="70" y1="310" x2="610" y2="310" class="ln thick" marker-end="url(#020-ciclo-pv-f)"/>
<line x1="70" y1="310" x2="70" y2="24" class="ln thick" marker-end="url(#020-ciclo-pv-f)"/>
<text x="606" y="356" class="tx2" text-anchor="end">Volumen del cilindro</text>
<text x="40" y="40" class="tx2" font-size="12" transform="rotate(-90 40 40)" text-anchor="end">Presión</text>
<line x1="160" y1="310" x2="160" y2="322" class="ln"/>
<text x="160" y="340" class="tx2" text-anchor="middle">PMS (volumen mínimo)</text>
<line x1="540" y1="310" x2="540" y2="322" class="ln"/>
<text x="540" y="340" class="tx2" text-anchor="middle">PMI (volumen máximo)</text>
<path d="M540 270 C420 262 250 235 160 175 L160 70 C260 105 400 185 540 225 Z" class="ac"/>
<path d="M540 270 C420 262 250 235 175 168 C150 125 175 78 215 76 C300 92 420 165 500 205 C522 228 536 250 540 270 Z" fill="none" class="wa-ln dash thick"/>
<circle cx="540" cy="270" r="4" class="ink-fill"/><circle cx="160" cy="175" r="4" class="ink-fill"/><circle cx="160" cy="70" r="4" class="ink-fill"/><circle cx="540" cy="225" r="4" class="ink-fill"/>
<text x="552" y="286" class="tx b">1</text><text x="140" y="188" class="tx b">2</text><text x="140" y="68" class="tx b">3</text><text x="552" y="222" class="tx b">4</text>
<text x="330" y="262" class="txa" text-anchor="middle">1 a 2: compresión</text>
<text x="146" y="104" class="txa" text-anchor="end" font-size="12">2 a 3:</text>
<text x="146" y="119" class="txa" text-anchor="end" font-size="12">combustión</text>
<text x="146" y="134" class="tx2" font-size="11" text-anchor="end">a volumen</text>
<text x="146" y="148" class="tx2" font-size="11" text-anchor="end">constante</text>
<text x="400" y="118" class="txa" text-anchor="middle">3 a 4: expansión</text>
<text x="572" y="248" class="txa" font-size="12" text-anchor="start">4 a 1:</text>
<text x="572" y="262" class="txa" font-size="12" text-anchor="start">escape</text>
<text x="330" y="52" class="txw b" text-anchor="middle">Línea discontinua: ciclo real</text>
<text x="330" y="68" class="tx2" font-size="11" text-anchor="middle">esquinas redondeadas y presión máxima menor</text>
<text x="330" y="292" class="tx2" font-size="11" text-anchor="middle">Zona azul: trabajo del ciclo teórico</text>
</svg>
