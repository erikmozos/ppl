<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336">
  <title>Modelo SHELL: el piloto (Liveware) en el centro y su interfaz con Software, Hardware, Environment y otras personas</title>
  <rect x="250" y="20" width="140" height="50" rx="6" class="soft"/>
  <text x="320" y="42" class="tx b" text-anchor="middle">S: Software</text>
  <text x="320" y="60" class="tx2" text-anchor="middle" font-size="11">normas, listas, manuales</text>
  <rect x="40" y="135" width="140" height="50" rx="6" class="soft"/>
  <text x="110" y="157" class="tx b" text-anchor="middle">H: Hardware</text>
  <text x="110" y="175" class="tx2" text-anchor="middle" font-size="11">avión y mandos</text>
  <rect x="460" y="135" width="140" height="50" rx="6" class="soft"/>
  <text x="530" y="157" class="tx b" text-anchor="middle">L: otras personas</text>
  <text x="530" y="175" class="tx2" text-anchor="middle" font-size="11">ATC y pasajeros</text>
  <rect x="250" y="250" width="140" height="50" rx="6" class="soft"/>
  <text x="320" y="272" class="tx b" text-anchor="middle">E: Environment</text>
  <text x="320" y="290" class="tx2" text-anchor="middle" font-size="11">tiempo, ruido, relieve</text>
  <rect x="240" y="120" width="160" height="80" rx="10" class="ac"/>
  <text x="320" y="152" class="txa b" text-anchor="middle" font-size="16">L: Liveware</text>
  <text x="320" y="174" class="tx" text-anchor="middle">el piloto</text>
  <path d="M320 70 L320 120" class="ac-ln thick"/>
  <path d="M180 160 L240 160" class="ac-ln thick"/>
  <path d="M400 160 L460 160" class="ac-ln thick"/>
  <path d="M320 200 L320 250" class="ac-ln thick"/>
  <text x="332" y="98" class="tx2" font-size="11">L-S</text>
  <text x="196" y="150" class="tx2" font-size="11">L-H</text>
  <text x="414" y="150" class="tx2" font-size="11">L-L</text>
  <text x="332" y="230" class="tx2" font-size="11">L-E</text>
  <text x="320" y="326" class="tx2" text-anchor="middle" font-size="11">Los accidentes aparecen donde las piezas no encajan: se adapta el entorno al piloto, no al revés</text>
</svg>
