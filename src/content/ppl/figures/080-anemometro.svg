  <text x="606" y="194" class="tx2">kt</text>
  <rect x="176" y="146" width="180" height="18" class="bg-fill"/>
  <rect x="176" y="146" width="180" height="18" class="soft"/>
  <rect x="195" y="116" width="236" height="18" class="ok"/>
  <rect x="431" y="116" width="105" height="18" class="wa"/>
  <line x1="536" y1="100" x2="536" y2="190" class="wa-ln thick"/>
  <text x="266" y="159" class="tx" text-anchor="middle">arco blanco</text>
  <text x="313" y="129" class="txo b" text-anchor="middle">arco verde</text>
  <text x="483" y="129" class="txw b" text-anchor="middle">arco amarillo</text>
  <text x="536" y="92" class="txw b" text-anchor="middle">VNE (línea roja)</text>
  <text x="176" y="178" class="tx2" text-anchor="middle">VS0</text>
  <text x="195" y="108" class="tx2" text-anchor="middle">VS1</text>
  <text x="356" y="178" class="tx2" text-anchor="middle">VFE</text>
  <text x="431" y="108" class="tx2" text-anchor="middle">VNO</text>
  <text x="20" y="30" class="tx b">Arcos del anemómetro (valores de ejemplo, tipo PA-28)</text>
  <text x="20" y="50" class="tx2">Blanco: VS0 a VFE, rango de uso de flaps.  Verde: VS1 a VNO, rango normal.</text>
  <text x="20" y="68" class="tx2">Amarillo: VNO a VNE, solo en aire en calma y con precaución.  Línea roja: VNE, límite que no debes superar.</text>
  <text x="20" y="245" class="tx2">El arco amarillo se dibuja aquí en naranja. Cada avión tiene sus valores en el POH.</text>
</svg>
