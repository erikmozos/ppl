<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260">
  <title>Arcos del anemómetro: blanco de VS0 a VFE, verde de VS1 a VNO, amarillo de VNO a VNE solo en aire en calma y línea roja en VNE</title>
  <line x1="40" y1="190" x2="598" y2="190" class="ln"/>
  <g class="tx2" text-anchor="middle">
    <line x1="40" y1="186" x2="40" y2="194" class="ln"/>
    <text x="40" y="210">0</text>
    <line x1="102" y1="186" x2="102" y2="194" class="ln"/>
    <text x="102" y="210">20</text>
    <line x1="164" y1="186" x2="164" y2="194" class="ln"/>
    <text x="164" y="210">40</text>
    <line x1="226" y1="186" x2="226" y2="194" class="ln"/>
    <text x="226" y="210">60</text>
    <line x1="288" y1="186" x2="288" y2="194" class="ln"/>
    <text x="288" y="210">80</text>
    <line x1="350" y1="186" x2="350" y2="194" class="ln"/>
    <text x="350" y="210">100</text>
    <line x1="412" y1="186" x2="412" y2="194" class="ln"/>
    <text x="412" y="210">120</text>
    <line x1="474" y1="186" x2="474" y2="194" class="ln"/>
    <text x="474" y="210">140</text>
    <line x1="536" y1="186" x2="536" y2="194" class="ln"/>
