<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
<title>Sección de una pala de hélice: ángulo de pala, ángulo de avance y ángulo de ataque</title>
<defs>
<marker id="020-angulo-pala-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
<marker id="020-angulo-pala-fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
</defs>
<line x1="30" y1="225" x2="610" y2="225" class="ln2 dash"/>
<text x="610" y="246" class="tx2" text-anchor="end">plano de rotación de la hélice</text>
<path d="M200 225 C230 186 330 120 412 112 C340 150 260 215 200 225 Z" class="ac"/>
<line x1="200" y1="225" x2="412" y2="112" class="ln dash"/>
<text x="350" y="190" class="tx2" font-size="11" transform="rotate(-28 350 190)">cuerda</text>
<line x1="16" y1="179" x2="198" y2="224" class="ln thick" marker-end="url(#020-angulo-pala-f)"/>
<text x="20" y="166" class="tx">viento relativo</text>
<path d="M262 225 A62 62 0 0 0 254.7 195.9" class="ac-ln" fill="none"/>
<text x="270" y="212" class="txa b">β</text>
<path d="M140 225 A62 62 0 0 1 139.9 210.3" class="wa-ln" fill="none"/>
<text x="118" y="216" class="txw b">φ</text>
<line x1="580" y1="150" x2="580" y2="90" class="ln thick" marker-end="url(#020-angulo-pala-f)"/>
<text x="572" y="104" class="tx2" text-anchor="end">V: avance del avión</text>
<line x1="580" y1="150" x2="500" y2="150" class="ln thick" marker-end="url(#020-angulo-pala-f)"/>
<text x="580" y="170" class="tx2" font-size="11" text-anchor="end">U: giro de la pala</text>
<text x="40" y="285" class="tx"><tspan class="txa b">β</tspan> ángulo de pala: cuerda y plano de rotación</text>
<text x="40" y="305" class="tx"><tspan class="txw b">φ</tspan> ángulo de avance: viento relativo y plano de rotación (tan φ = V ÷ U)</text>
<text x="40" y="325" class="tx">Ángulo de ataque α = β − φ</text>
</svg>
