<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>Riesgo orientativo de hielo en el carburador según temperatura y humedad relativa (esquema propio)</title>
<rect x="70" y="30" width="530" height="270" class="bg-fill"/>
<rect x="114" y="30" width="397" height="162" class="soft"/>
<rect x="158" y="30" width="309" height="108" class="wa"/>
<rect x="203" y="30" width="220" height="54" class="wa thick"/>
<line x1="70" y1="30" x2="70" y2="300" class="ln"/>
<line x1="70" y1="300" x2="600" y2="300" class="ln"/>
<line x1="291" y1="30" x2="291" y2="300" class="ln2 dash"/>
<text x="293" y="318" class="tx2" font-size="11">0 °C</text>
<text x="70" y="318" class="tx2" font-size="11" text-anchor="middle">−20</text>
<text x="158" y="318" class="tx2" font-size="11" text-anchor="middle">−10</text>
<text x="379" y="318" class="tx2" font-size="11" text-anchor="middle">+10</text>
<text x="467" y="318" class="tx2" font-size="11" text-anchor="middle">+25</text>
<text x="555" y="318" class="tx2" font-size="11" text-anchor="middle">+35</text>
<text x="335" y="344" class="tx" text-anchor="middle">Temperatura exterior (°C)</text>
<text x="62" y="34" class="tx2" font-size="11" text-anchor="end">100 %</text>
<text x="62" y="138" class="tx2" font-size="11" text-anchor="end">60 %</text>
<text x="62" y="196" class="tx2" font-size="11" text-anchor="end">40 %</text>
<text x="62" y="304" class="tx2" font-size="11" text-anchor="end">0 %</text>
<text x="18" y="170" class="tx" transform="rotate(-90 18 170)" text-anchor="middle">Humedad relativa</text>
<text x="313" y="62" class="txw b" text-anchor="middle">Grave a cualquier potencia</text>
<text x="313" y="112" class="txw" text-anchor="middle">Moderado en crucero; grave con potencia reducida</text>
<text x="313" y="166" class="tx2" text-anchor="middle">Posible con potencia reducida (descenso, ralentí)</text>
<text x="335" y="250" class="tx2" text-anchor="middle">Riesgo bajo, pero no nulo: con nubes o niebla puede formarse hielo</text>
<text x="335" y="382" class="tx2" font-size="11" text-anchor="middle">Esquema propio y orientativo; no sustituye a las instrucciones del POH.</text>
</svg>
