<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
<title>Punto de espera de pista: marca del patrón A con dos líneas continuas del lado de espera y dos discontinuas del lado de la pista, letrero de instrucción obligatoria y barra de parada</title>
<defs><marker id="070-pe-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker></defs>
<rect x="20" y="20" width="600" height="70" class="soft"/>
<text x="320" y="62" class="tx b" text-anchor="middle">PISTA 09 / 27 (zona protegida)</text>
<rect x="270" y="90" width="100" height="270" class="ground"/>
<line x1="320" y1="100" x2="320" y2="125" class="ln2 dash"/>
<line x1="270" y1="140" x2="370" y2="140" class="ln thick dash"/>
<line x1="270" y1="152" x2="370" y2="152" class="ln thick dash"/>
<line x1="270" y1="176" x2="370" y2="176" class="ln thick"/>
<line x1="270" y1="188" x2="370" y2="188" class="ln thick"/>
<text x="380" y="148" class="tx2">discontinuas: lado de la pista</text>
<text x="380" y="186" class="tx2">continuas: lado de espera</text>
<line x1="320" y1="340" x2="320" y2="230" class="ac-ln thick" marker-end="url(#070-pe-k)"/>
<text x="332" y="300" class="txa b">tu avión en rodaje</text>
<text x="332" y="318" class="tx2">no cruces sin autorización</text>
<rect x="150" y="196" width="90" height="40" class="wa"/>
<text x="195" y="222" class="tx b" text-anchor="middle">27-09</text>
<text x="195" y="254" class="tx2" text-anchor="middle">instrucción obligatoria</text>
<text x="195" y="270" class="tx2" text-anchor="middle">(blanco sobre rojo)</text>
<rect x="40" y="120" width="40" height="40" class="soft"/>
<text x="60" y="147" class="tx b" text-anchor="middle">B</text>
<text x="90" y="134" class="tx2">ubicación</text>
<text x="90" y="150" class="tx2">(negro / amarillo)</text>
<circle cx="285" cy="208" r="4" class="wa-fill"/>
<circle cx="305" cy="208" r="4" class="wa-fill"/>
<circle cx="335" cy="208" r="4" class="wa-fill"/>
<circle cx="355" cy="208" r="4" class="wa-fill"/>
<text x="384" y="212" class="txw b">barra de parada</text>
<text x="384" y="230" class="tx2">luces rojas: si está encendida,</text><text x="384" y="246" class="tx2">no cruces aunque tengas autorización</text>

</svg>