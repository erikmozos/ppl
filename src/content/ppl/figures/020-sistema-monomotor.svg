<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>Esquema eléctrico de un monomotor ligero con generador, regulador, relé de desconexión, barra, batería y cargas esenciales y no esenciales</title>
<defs>
<marker id="020-sistema-monomotor-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
</defs>
<rect x="30" y="28" width="130" height="50" class="ac"/>
<text x="95" y="50" class="tx b" text-anchor="middle">Generador</text>
<text x="95" y="66" class="tx2" font-size="11" text-anchor="middle">o alternador + diodos</text>
<rect x="210" y="28" width="130" height="50" class="ok"/>
<text x="275" y="50" class="txo b" text-anchor="middle">Regulador</text>
<text x="275" y="66" class="tx2" font-size="11" text-anchor="middle">mantiene 14 V</text>
<line x1="210" y1="53" x2="162" y2="53" class="ok-ln dash" marker-end="url(#020-sistema-monomotor-f)"/>
<text x="186" y="46" class="txo" font-size="11" text-anchor="middle">campo</text>
<line x1="95" y1="78" x2="95" y2="108" class="ln thick"/>
<rect x="30" y="108" width="130" height="46" class="wa"/>
<text x="95" y="128" class="txw b" text-anchor="middle">Relé de desconexión</text>
<text x="95" y="144" class="tx2" font-size="11" text-anchor="middle">(cut-out relay)</text>
<line x1="95" y1="154" x2="95" y2="214" class="ln thick" marker-end="url(#020-sistema-monomotor-f)"/>
<line x1="40" y1="216" x2="610" y2="216" class="ac-ln thick"/>
<text x="330" y="236" class="txa b" text-anchor="middle">Barra de distribución (bus bar)</text>
<line x1="230" y1="216" x2="230" y2="272" class="ln thick"/>
<rect x="160" y="272" width="140" height="48" class="ac"/>
<text x="230" y="293" class="tx b" text-anchor="middle">Batería</text>
<text x="230" y="309" class="tx2" font-size="11" text-anchor="middle">unos 30 min de reserva</text>
<line x1="400" y1="216" x2="400" y2="160" class="ln"/>
<rect x="392" y="178" width="16" height="14" class="ok"/>
<rect x="340" y="110" width="120" height="50" class="ok"/>
<text x="400" y="132" class="txo b" text-anchor="middle">Cargas esenciales</text>
<text x="400" y="148" class="tx2" font-size="11" text-anchor="middle">radio, instrumentos</text>
<line x1="545" y1="216" x2="545" y2="160" class="ln"/>
<rect x="537" y="178" width="16" height="14" class="wa"/>
<rect x="485" y="110" width="125" height="50" class="soft"/>
<text x="547" y="132" class="tx b" text-anchor="middle">No esenciales</text>
<text x="547" y="148" class="tx2" font-size="11" text-anchor="middle">luces, calefacción</text>
<text x="547" y="100" class="txw b" font-size="12" text-anchor="middle">se apagan primero</text>
<text x="547" y="86" class="txw" font-size="11" text-anchor="middle">(load shedding)</text>
<text x="30" y="352" class="tx2" font-size="11">Generador, batería y cargas van en paralelo a la barra. Cuadrados: disyuntores o interruptores.</text>
<text x="30" y="370" class="tx2" font-size="11">Si el generador falla, el relé se abre y la batería no alimenta al generador.</text>
<text x="30" y="388" class="tx2" font-size="11">Entonces la batería sostiene solo lo esencial.</text>
</svg>
