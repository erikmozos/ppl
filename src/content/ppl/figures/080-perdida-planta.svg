<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410">
  <title>Dónde empieza la pérdida según la planta del ala: rectangular, trapezoidal sin torsión, elíptica y con torsión</title>
  <text x="165" y="36" class="tx b" text-anchor="middle">rectangular</text>
  <rect x="40" y="54" width="250" height="50" class="ac"/>
  <rect x="120" y="54" width="90" height="50" class="wa"/>
  <rect x="47" y="94" width="48" height="10" class="soft"/>
  <rect x="235" y="94" width="48" height="10" class="soft"/>
  <ellipse cx="165" cy="80" rx="8" ry="32" class="soft"/>
  <text x="165" y="136" class="tx2" text-anchor="middle">empieza en la raíz y avanza hacia</text>
  <text x="165" y="152" class="tx2" text-anchor="middle">las puntas: buen aviso, alerones útiles</text>
  <text x="475" y="36" class="tx b" text-anchor="middle">trapezoidal sin torsión</text>
  <polygon points="350.0,66.0 475.0,52.0 600.0,66.0 600.0,94.0 475.0,108.0 350.0,94.0" class="ac"/>
  <polygon points="409.0,59.4 363.0,64.5 363.0,95.5 409.0,100.6" class="wa"/>
  <polygon points="541.0,59.4 587.0,64.5 587.0,95.5 541.0,100.6" class="wa"/>
  <polygon points="405.0,100.2 357.0,94.8 357.0,86.8 405.0,92.2" class="soft"/>
  <polygon points="545.0,100.2 593.0,94.8 593.0,86.8 545.0,92.2" class="soft"/>
  <ellipse cx="475" cy="80" rx="8" ry="32" class="soft"/>
  <text x="475" y="136" class="tx2" text-anchor="middle">empieza hacia la punta, delante</text>
  <text x="475" y="152" class="tx2" text-anchor="middle">de los alerones: riesgo de caer un ala</text>
  <text x="165" y="226" class="tx b" text-anchor="middle">elíptica</text>
  <ellipse cx="165" cy="270" rx="125" ry="27" class="wa"/>
  <ellipse cx="165" cy="270" rx="8" ry="32" class="soft"/>
  <text x="165" y="326" class="tx2" text-anchor="middle">casi a la vez en toda la envergadura:</text>
  <text x="165" y="342" class="tx2" text-anchor="middle">poco aviso previo</text>
  <text x="475" y="226" class="tx b" text-anchor="middle">trapezoidal con torsión (washout)</text>
  <polygon points="350.0,256.0 475.0,242.0 600.0,256.0 600.0,284.0 475.0,298.0 350.0,284.0" class="ac"/>
  <polygon points="425.0,247.6 475.0,242.0 525.0,247.6 525.0,292.4 475.0,298.0 425.0,292.4" class="wa"/>
  <polygon points="405.0,290.2 357.0,284.8 357.0,276.8 405.0,282.2" class="soft"/>
  <polygon points="545.0,290.2 593.0,284.8 593.0,276.8 545.0,282.2" class="soft"/>
  <ellipse cx="475" cy="270" rx="8" ry="32" class="soft"/>
  <text x="475" y="326" class="tx2" text-anchor="middle">la punta tiene menos calaje: la raíz</text>
  <text x="475" y="342" class="tx2" text-anchor="middle">entra antes y los alerones siguen útiles</text>
  <line x1="20" y1="198" x2="620" y2="198" class="ln2"/>
  <line x1="320" y1="20" x2="320" y2="370" class="ln2"/>
  <rect x="40" y="384" width="18" height="14" class="wa"/>
  <text x="66" y="396" class="tx">zona donde empieza la separación</text>
  <rect x="330" y="384" width="18" height="14" class="soft"/>
  <text x="356" y="396" class="tx">alerones</text>
</svg>
