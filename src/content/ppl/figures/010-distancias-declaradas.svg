<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <title>Distancias declaradas de pista: TORA, TODA, ASDA y LDA, con umbral desplazado, zona de parada y zona libre de obstáculos</title>
  <defs>
    <marker id="010-dist-flecha" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
  </defs>
  <rect x="8" y="8" width="624" height="304" rx="8" class="sky"/>
  <rect x="60" y="50" width="70" height="36" class="soft"/>
  <rect x="130" y="50" width="300" height="36" class="ac"/>
  <rect x="430" y="50" width="60" height="36" class="wa"/>
  <rect x="490" y="50" width="110" height="36" fill="none" class="ln2 dash"/>
  <line x1="130" y1="44" x2="130" y2="92" class="ln thick"/>
  <text x="95" y="36" class="tx2" text-anchor="middle" font-size="11">Umbral</text>
  <text x="95" y="48" class="tx2" text-anchor="middle" font-size="11">desplazado</text>
  <text x="280" y="72" class="txa b" text-anchor="middle">Pista</text>
  <text x="460" y="72" class="txw b" text-anchor="middle" font-size="12">SWY</text>
  <text x="545" y="72" class="tx2" text-anchor="middle" font-size="12">CWY</text>
  <text x="545" y="36" class="tx2" text-anchor="middle" font-size="11">Zona libre</text>
  <text x="545" y="48" class="tx2" text-anchor="middle" font-size="11">de obstáculos</text>
  <text x="460" y="36" class="tx2" text-anchor="middle" font-size="11">Zona de</text>
  <text x="460" y="48" class="tx2" text-anchor="middle" font-size="11">parada</text>
  <line x1="130" y1="94" x2="130" y2="262" class="ln2 dash"/>
  <line x1="60" y1="94" x2="60" y2="226" class="ln2 dash"/>
  <line x1="430" y1="94" x2="430" y2="262" class="ln2 dash"/>
  <line x1="490" y1="94" x2="490" y2="226" class="ln2 dash"/>
  <line x1="600" y1="94" x2="600" y2="226" class="ln2 dash"/>
  <line x1="60" y1="140" x2="430" y2="140" class="ac-ln" marker-start="url(#010-dist-flecha)" marker-end="url(#010-dist-flecha)"/>
  <text x="245" y="134" class="tx b" text-anchor="middle">TORA: carrera de despegue disponible</text>
  <line x1="60" y1="176" x2="490" y2="176" class="wa-ln" marker-start="url(#010-dist-flecha)" marker-end="url(#010-dist-flecha)"/>
  <text x="275" y="170" class="tx b" text-anchor="middle">ASDA: TORA + zona de parada</text>
  <line x1="60" y1="212" x2="600" y2="212" class="ok-ln" marker-start="url(#010-dist-flecha)" marker-end="url(#010-dist-flecha)"/>
  <text x="330" y="206" class="tx b" text-anchor="middle">TODA: TORA + zona libre de obstáculos</text>
  <line x1="130" y1="248" x2="430" y2="248" class="ln thick" marker-start="url(#010-dist-flecha)" marker-end="url(#010-dist-flecha)"/>
  <text x="280" y="242" class="tx b" text-anchor="middle">LDA: aterrizaje disponible (desde el umbral)</text>
  <text x="320" y="296" class="tx2" text-anchor="middle">Despegue y aterrizaje hacia la derecha. El umbral desplazado reduce la LDA, no la TORA</text>
</svg>
