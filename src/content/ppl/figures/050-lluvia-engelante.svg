<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
<title>Lluvia engelante: nieve que cae, se funde en una capa cálida sobre cero y se sobreenfría en una capa fría junto al suelo, donde congela al chocar con el avión (esquema propio)</title>
<defs><marker id="050-lluvia-engelante-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker></defs>
<text x="90" y="22" class="tx b" text-anchor="middle">Temperatura</text>
<line x1="30" y1="290" x2="150" y2="290" class="ln"/><line x1="30" y1="40" x2="30" y2="290" class="ln"/>
<line x1="90" y1="40" x2="90" y2="290" class="wa-ln dash"/><text x="90" y="308" class="txw b" text-anchor="middle" font-size="12">0 °C</text>
<polyline points="50,60 62,120 112,150 128,190 60,235 52,285" class="ac-ln thick" fill="none"/>
<text x="30" y="324" class="tx2" font-size="11">frío</text><text x="150" y="324" class="tx2" font-size="11" text-anchor="end">cálido</text>
