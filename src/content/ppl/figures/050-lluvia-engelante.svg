<text x="204" y="62" class="txa b">Capa fría de arriba: nieve</text><text x="204" y="80" class="tx2" font-size="12">los cristales bajan sin fundirse</text>
<text x="204" y="152" class="txw b">Capa cálida (sobre 0 °C): lluvia</text><text x="204" y="170" class="tx2" font-size="12">la nieve se funde y las gotas crecen</text>
<text x="204" y="232" class="txa b">Capa fría junto al suelo (bajo 0 °C)</text><text x="204" y="250" class="tx2" font-size="12">gotas sobreenfriadas: siguen líquidas</text>
