<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340">
<title>Efecto de una microrráfaga en la aproximación: el avión sube sobre la trayectoria con el viento de cara, se hunde en la corriente descendente y cae por debajo con el viento de cola, con la velocidad indicada primero subiendo y luego bajando</title>
<defs><marker id="070-cizalladura-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker></defs>
<rect x="0" y="0" width="640" height="340" class="sky"/>
<rect x="0" y="262" width="640" height="78" class="ground"/>
<rect x="470" y="256" width="150" height="6" class="soft"/>
<line x1="20" y1="70" x2="470" y2="256" class="ac-ln dash"/>
<text x="30" y="62" class="txa">trayectoria prevista (≈ 3°)</text>
<path d="M20 70 C140 118 190 108 240 126 C290 150 340 214 400 258" class="wa-ln thick" fill="none" marker-end="url(#070-cizalladura-k)"/>
<text x="318" y="226" class="txw b" text-anchor="end">trayectoria real</text>
<line x1="280" y1="30" x2="280" y2="150" class="ac-ln thick" marker-end="url(#070-cizalladura-k)"/>
<text x="290" y="48" class="txa b">corriente descendente</text>
<rect x="30" y="274" width="170" height="26" class="ok"/>
<text x="115" y="292" class="txo b" text-anchor="middle">1 viento de cara: IAS sube</text>
<rect x="210" y="274" width="120" height="26" class="soft"/>
<text x="270" y="292" class="tx b" text-anchor="middle">2 hundimiento</text>
<rect x="340" y="274" width="130" height="26" class="wa"/>
<text x="405" y="292" class="txw b" text-anchor="middle">3 cola: IAS cae</text>
<text x="30" y="324" class="tx2">Error típico: con el viento de cara inicial se reduce potencia y, después, no hay margen para recuperar.</text>
</svg>