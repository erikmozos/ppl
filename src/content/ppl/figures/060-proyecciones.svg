<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366">
  <title>Comparación de las proyecciones Mercator y Lambert: forma de meridianos, paralelos, loxodrómica y ortodrómica</title>
  <rect x="10" y="40" width="300" height="230" rx="6" class="soft"/>
  <rect x="330" y="40" width="300" height="230" rx="6" class="soft"/>
  <text x="160" y="26" class="tx b" text-anchor="middle">Mercator</text>
  <text x="480" y="26" class="tx b" text-anchor="middle">Lambert conforme</text>
  <line x1="40" y1="50" x2="40" y2="260" class="ln2"/>
  <line x1="100" y1="50" x2="100" y2="260" class="ln2"/>
  <line x1="160" y1="50" x2="160" y2="260" class="ln2"/>
  <line x1="220" y1="50" x2="220" y2="260" class="ln2"/>
  <line x1="280" y1="50" x2="280" y2="260" class="ln2"/>
  <line x1="20" y1="252" x2="300" y2="252" class="ln2"/>
  <line x1="20" y1="222" x2="300" y2="222" class="ln2"/>
  <line x1="20" y1="186" x2="300" y2="186" class="ln2"/>
  <line x1="20" y1="142" x2="300" y2="142" class="ln2"/>
  <line x1="20" y1="88" x2="300" y2="88" class="ln2"/>
  <path d="M60 232 L270 100" class="wa-ln thick"/>
  <path d="M60 232 Q 110 105 270 100" class="ac-ln thick dash" fill="none"/>
  <circle cx="60" cy="232" r="4" class="ink-fill"/><circle cx="270" cy="100" r="4" class="ink-fill"/>
  <line x1="435.7" y1="71.5" x2="360" y2="262" class="ln2"/>
  <line x1="456.6" y1="77.7" x2="420" y2="262" class="ln2"/>
  <line x1="480.0" y1="80.0" x2="480" y2="262" class="ln2"/>
  <line x1="503.4" y1="77.7" x2="540" y2="262" class="ln2"/>
  <line x1="524.3" y1="71.5" x2="600" y2="262" class="ln2"/>
  <path d="M369.2 238.8 A300 300 0 0 0 590.8 238.8" class="ln2" fill="none"/>
  <path d="M387.7 192.3 A250 250 0 0 0 572.3 192.3" class="ln2" fill="none"/>
  <path d="M406.1 145.9 A200 200 0 0 0 553.9 145.9" class="ln2" fill="none"/>
  <path d="M424.6 99.4 A150 150 0 0 0 535.4 99.4" class="ln2" fill="none"/>
  <path d="M380 218 L580 120" class="ac-ln thick dash"/>
  <path d="M380 218 Q 480 215 580 120" class="wa-ln thick" fill="none"/>
  <circle cx="380" cy="218" r="4" class="ink-fill"/><circle cx="580" cy="120" r="4" class="ink-fill"/>
  <text x="20" y="290" class="tx2">Meridianos: rectas paralelas</text>
  <text x="20" y="306" class="tx2">Paralelos: rectas, cada vez más separados</text>
  <text x="20" y="322" class="tx2">Escala crece con la latitud</text>
  <text x="340" y="290" class="tx2">Meridianos: rectas que convergen</text>
  <text x="340" y="306" class="tx2">Paralelos: arcos concéntricos</text>
  <text x="340" y="322" class="tx2">Escala casi constante</text>
  <line x1="170" y1="350" x2="200" y2="350" class="wa-ln thick"/>
  <text x="208" y="354" class="txw b">loxodrómica (rumbo constante)</text>
  <line x1="400" y1="350" x2="430" y2="350" class="ac-ln thick dash"/>
  <text x="438" y="354" class="txa b">ortodrómica (círculo máximo)</text>
</svg>