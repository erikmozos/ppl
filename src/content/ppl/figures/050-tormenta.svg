<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330">
  <title>Ciclo de vida de una tormenta de masa de aire: fase de cúmulo con corrientes ascendentes, madurez con ascendentes y descendentes y disipación con descendentes</title>
  <defs>
    <marker id="050-tormenta-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
    <marker id="050-tormenta-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
  </defs>
  <rect x="10" y="40" width="200" height="220" rx="6" class="sky"/>
  <rect x="220" y="40" width="200" height="220" rx="6" class="sky"/>
  <rect x="430" y="40" width="200" height="220" rx="6" class="sky"/>
  <rect x="10" y="236" width="200" height="24" class="ground"/>
  <rect x="220" y="236" width="200" height="24" class="ground"/>
  <rect x="430" y="236" width="200" height="24" class="ground"/>
  <text x="110" y="28" class="tx b" text-anchor="middle">1 Cúmulo</text>
  <text x="320" y="28" class="tx b" text-anchor="middle">2 Madurez</text>
  <text x="530" y="28" class="tx b" text-anchor="middle">3 Disipación</text>
  <path d="M60 232 C50 200 58 150 74 130 C70 100 100 76 128 88 C160 80 170 116 162 140 C176 170 166 210 156 232 Z" class="soft"/>
  <line x1="95" y1="228" x2="95" y2="104" class="wa-ln thick" marker-end="url(#050-tormenta-a)"/>
  <line x1="125" y1="228" x2="125" y2="96" class="wa-ln thick" marker-end="url(#050-tormenta-a)"/>
  <text x="110" y="250" class="tx2" text-anchor="middle" font-size="11">solo ascendentes</text>
  <path d="M250 232 C246 200 250 160 262 140 C250 110 270 82 296 82 L300 66 C330 62 370 62 400 70 L392 86 C380 92 392 100 392 120 C400 150 396 200 392 232 Z" class="soft"/>
  <path d="M296 66 C320 56 380 54 404 62" class="ln2"/>
  <line x1="290" y1="228" x2="290" y2="100" class="wa-ln thick" marker-end="url(#050-tormenta-a)"/>
  <line x1="350" y1="100" x2="350" y2="226" class="ac-ln thick" marker-end="url(#050-tormenta-b)"/>
  <line x1="372" y1="100" x2="372" y2="226" class="ac-ln thick" marker-end="url(#050-tormenta-b)"/>
  <g class="ac-ln"><line x1="342" y1="200" x2="338" y2="234"/><line x1="360" y1="200" x2="356" y2="234"/><line x1="378" y1="200" x2="374" y2="234"/></g>
  <text x="320" y="250" class="tx2" text-anchor="middle" font-size="11">ascendentes y descendentes</text>
  <path d="M470 200 C466 170 470 150 486 140 C480 120 500 100 526 104 C546 100 560 112 556 130 C572 150 570 180 560 200 Z" class="soft"/>
  <path d="M520 100 C560 94 600 96 620 104 C590 112 560 112 530 112 Z" class="soft"/>
  <line x1="505" y1="104" x2="505" y2="226" class="ac-ln thick" marker-end="url(#050-tormenta-b)"/>
  <line x1="535" y1="110" x2="535" y2="226" class="ac-ln thick" marker-end="url(#050-tormenta-b)"/>
  <text x="530" y="250" class="tx2" text-anchor="middle" font-size="11">solo descendentes</text>
  <text x="110" y="284" class="tx2" text-anchor="middle" font-size="11">10 a 20 min; sin lluvia</text>
  <text x="320" y="284" class="tx b" text-anchor="middle" font-size="11">fase más peligrosa</text>
  <text x="320" y="298" class="tx2" text-anchor="middle" font-size="11">granizo, rayos, microrráfagas</text>
  <text x="530" y="284" class="tx2" text-anchor="middle" font-size="11">lluvia que se debilita</text>
  <text x="320" y="320" class="tx2" text-anchor="middle" font-size="11">Cada celda dura unos 30 a 60 min; los sistemas multicelulares se renuevan</text>
</svg>
