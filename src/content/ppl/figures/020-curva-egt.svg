<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<title>Potencia y temperatura de los gases de escape (EGT) según la riqueza de la mezcla (curvas esquemáticas)</title>
<line x1="70" y1="30" x2="70" y2="290" class="ln"/>
<line x1="70" y1="290" x2="610" y2="290" class="ln"/>
<text x="20" y="160" class="tx" transform="rotate(-90 20 160)" text-anchor="middle">Potencia y EGT (relativas)</text>
<text x="90" y="310" class="tx2" font-size="11">RICA</text>
<text x="590" y="310" class="tx2" font-size="11" text-anchor="end">POBRE</text>
<text x="340" y="378" class="tx" text-anchor="middle">Relación aire:combustible en masa (kg de aire por kg de gasolina)</text>
<path d="M100 200 C150 120 200 76 240 76 C310 76 400 130 470 190 S560 256 600 272" class="ac-ln thick" fill="none"/>
<path d="M100 262 C200 220 300 100 392 56 C440 52 500 110 600 200" class="wa-ln thick" fill="none"/>
<line x1="240" y1="40" x2="240" y2="290" class="ln2 dash"/>
<line x1="392" y1="40" x2="392" y2="290" class="ln2 dash"/>
<line x1="470" y1="40" x2="470" y2="290" class="ln2 dash"/>
<text x="240" y="328" class="tx b" text-anchor="middle">12:1</text>
<text x="240" y="344" class="tx2" font-size="11" text-anchor="middle">máxima potencia</text>
<text x="392" y="328" class="tx b" text-anchor="middle">15:1</text>
<text x="392" y="344" class="tx2" font-size="11" text-anchor="middle">estequiométrica</text>
<text x="392" y="360" class="tx2" font-size="11" text-anchor="middle">(cerca del pico de EGT)</text>
<text x="478" y="328" class="tx b">16-17:1</text>
<text x="478" y="344" class="tx2" font-size="11">máxima economía</text>
<text x="118" y="150" class="txa b">Potencia</text>
<text x="500" y="110" class="txw b">EGT</text>
<text x="80" y="44" class="tx2" font-size="11">Mezcla rica: más fría, más</text>
<text x="80" y="58" class="tx2" font-size="11">refrigeración, más consumo</text>
<text x="600" y="44" class="tx2" font-size="11" text-anchor="end">Mezcla pobre: más calor</text>
<text x="600" y="58" class="tx2" font-size="11" text-anchor="end">y riesgo de detonación</text>
</svg>
