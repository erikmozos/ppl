<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380">
  <title>Polar del avión: coeficiente de sustentación frente a coeficiente de resistencia, con la tangente desde el origen que marca la finura máxima</title>
  <defs>
    <marker id="080-polar-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
  </defs>
  <line x1="80" y1="330" x2="615" y2="330" class="ln" marker-end="url(#080-polar-k)"/>
  <line x1="80" y1="330" x2="80" y2="30" class="ln" marker-end="url(#080-polar-k)"/>
  <text x="610" y="352" class="tx b" text-anchor="end">coeficiente de resistencia CD</text>
  <text x="40" y="180" class="tx b" text-anchor="middle" transform="rotate(-90 40 180)">coeficiente de sustentación CL</text>
  <polyline points="158.0,330.0 158.4,320.9 159.4,311.9 161.2,302.9 163.7,293.8 166.9,284.8 170.9,275.7 175.5,266.6 180.9,257.6 187.0,248.6 193.8,239.5 201.3,230.4 209.5,221.4 218.4,212.3 228.1,203.3 238.4,194.2 249.5,185.2 261.3,176.1 273.8,167.1 287.1,158.0 301.0,149.0 315.7,139.9 331.0,130.9 347.1,121.8 363.9,112.8 381.4,103.8 399.7,94.7 418.6,85.6 438.3,76.6 458.7,67.5 479.8,58.5" class="ac-ln thick" fill="none"/>
  <line x1="80" y1="330" x2="321.8" y2="122.8" class="wa-ln dash"/>
  <line x1="158.0" y1="330" x2="158.0" y2="318" class="ln"/>
  <circle cx="158.0" cy="330.0" r="5" class="ink-fill"/>
  <circle cx="236.0" cy="196.3" r="5" class="wa-fill"/>
  <circle cx="479.8" cy="58.5" r="5" class="ink-fill"/>
  <text x="168.0" y="316" class="tx" >CD0: resistencia parásita mínima (CL = 0)</text>
  <text x="250.0" y="218.3" class="txw b">punto de tangencia:</text>
  <text x="250.0" y="234.3" class="txw">CL/CD máximo = finura máxima</text>
  <text x="250.0" y="250.3" class="txw">(mejor planeo, α de 4° a 6°)</text>
  <text x="492" y="50" class="tx b">CLmax:</text>
  <text x="492" y="66" class="tx b">pérdida</text>
  <text x="327.8" y="126.8" class="tx2">tangente desde el origen</text>
  <text x="340" y="276" class="tx2">cada punto es un ángulo de ataque distinto:</text>
  <text x="340" y="292" class="tx2">pequeños abajo; grandes, arriba</text>
</svg>
