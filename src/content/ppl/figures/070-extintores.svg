<text x="30" y="342" class="tx2">Agua: nunca sobre combustible, aceite ni equipo eléctrico. Tras usar un extintor en cabina, ventila.</text>
<text x="30" y="362" class="tx2">Los extintores portátiles de cabina de un avión ligero son de halón o halotron (o de CO2).</text>
