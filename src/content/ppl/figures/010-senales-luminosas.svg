  <text x="416" y="290.0" class="tx">Regrese al punto</text>
  <text x="416" y="306.0" class="tx2">de partida</text>
  <rect x="8" y="322" width="624" height="50" rx="6" class="soft"/>
  <polygon points="40.0,332.0 42.3,341.5 50.6,336.4 45.5,344.7 55.0,347.0 45.5,349.3 50.6,357.6 42.3,352.5 40.0,362.0 37.7,352.5 29.4,357.6 34.5,349.3 25.0,347.0 34.5,344.7 29.4,336.4 37.7,341.5" class="wa-fill"/>
  <text x="68" y="345.0" class="txw b">Pirotecnia</text>
  <text x="68" y="361.0" class="tx2">roja</text>
  <line x1="170" y1="328" x2="170" y2="366" class="ln2"/>
  <line x1="406" y1="328" x2="406" y2="366" class="ln2"/>
  <text x="180" y="344.0" class="tx">No aterrice por ahora</text>
  <text x="180" y="360.0" class="tx2">pese a instrucciones anteriores</text>
  <text x="416" y="352.0" class="tx">—</text>
  <text x="320" y="390" class="tx b" text-anchor="middle">El verde autoriza · el rojo detiene o niega · el blanco devuelve</text>
  <text x="320" y="410" class="tx2" text-anchor="middle">Acuse en vuelo: de día, alabear (no en base ni en final); de noche, dos destellos de faros.</text>
  <text x="320" y="426" class="tx2" text-anchor="middle">Acuse en tierra: de día, mover alerones o timón; de noche, dos destellos de faros.</text>
