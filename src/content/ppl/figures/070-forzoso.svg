<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450">
<title>Circuito de aterrizaje forzoso sin motor: punto alto a unos 2000 ft sobre el campo, punto bajo a unos 1000 ft, base y final contra el viento</title>
<defs><marker id="070-forzoso-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker><marker id="070-forzoso-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker></defs>
<rect x="0" y="0" width="640" height="450" class="ground"/>
<rect x="400" y="60" width="70" height="210" class="ok"/>
<text x="435" y="150" class="txo b" text-anchor="middle">campo</text>
<text x="435" y="168" class="tx2" text-anchor="middle">elegido</text>
<path d="M200 250 L200 330 C200 395 300 410 380 385 C415 374 435 352 435 330 L435 272" class="ac-ln thick" fill="none" marker-end="url(#070-forzoso-k)"/>
<line x1="200" y1="250" x2="435" y2="250" class="ln2 dash"/>
<circle cx="200" cy="250" r="6" class="wa-fill"/>
<text x="20" y="226" class="txw b">PUNTO ALTO</text>
<text x="20" y="242" class="tx2">≈ 2000 ft AGL</text><text x="20" y="258" class="tx2">a la altura de la toma</text>
<circle cx="200" cy="330" r="6" class="wa-fill"/>
<text x="20" y="326" class="txw b">PUNTO BAJO</text>
<text x="20" y="342" class="tx2">≈ 1000 ft AGL</text><text x="20" y="358" class="tx2">inicio del viraje a base</text>
<text x="215" y="290" class="tx2">viento en cola</text>
<text x="290" y="415" class="tx2" text-anchor="middle">base</text>
<text x="445" y="322" class="tx2">final</text>
<line x1="540" y1="70" x2="540" y2="160" class="ac-ln thick" marker-end="url(#070-forzoso-w)"/>
<text x="552" y="120" class="txa b">viento</text>
<text x="20" y="30" class="tx b">Circuito de aterrizaje forzoso (planta)</text>
<text x="20" y="440" class="tx2">Alturas orientativas: se ajustan al planeo del avión y al viento. Aterriza contra el viento.</text>
</svg>