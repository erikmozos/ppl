<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350">
  <title>Tipos de propagación de las ondas de radio: onda de tierra que sigue la superficie, onda espacial con rayo directo y rayo reflejado, y onda ionosférica que rebota en la ionosfera</title>
  <defs>
    <marker id="090-ondas-flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
  </defs>
  <rect x="0" y="0" width="640" height="350" class="sky"/>
  <rect x="0" y="36" width="640" height="44" class="ac" opacity="0.6"/>
  <text x="14" y="55" class="txa b">Ionosfera</text>
  <text x="14" y="71" class="tx2">capas ionizadas, de 60 a 400 km de altura</text>
  <path d="M0 300 Q320 220 640 300 L640 350 L0 350 Z" class="ground"/>
  <path d="M0 300 Q320 220 640 300" class="ln thick" fill="none"/>
  <line x1="64" y1="285.6" x2="64" y2="266" class="ln thick"/>
  <line x1="56" y1="266" x2="72" y2="266" class="ln thick"/>
  <text x="64" y="316" class="tx b" text-anchor="middle">Emisor</text>
  <path d="M68 281 Q140 264 215 266" class="ok-ln thick" fill="none"/>
  <text x="110" y="316" class="txo b">Onda de tierra</text>
  <text x="110" y="332" class="tx2" font-size="11">LF y MF; se debilita pronto</text>
  <line x1="68" y1="266" x2="436" y2="152" class="ac-ln thick"/>
  <path d="M68 268 L300 260 L436 154" class="ac-ln dash" fill="none"/>
  <g transform="translate(452 138)">
    <path d="M-16 4 L16 4 M0 -2 L0 12 M-8 12 L8 12" class="ln thick" fill="none"/>
    <ellipse cx="0" cy="4" rx="22" ry="5" class="bg-fill"/>
    <path d="M-22 4 L22 4 M0 -6 L0 12 M-7 12 L7 12" class="ln thick" fill="none"/>
  </g>
  <text x="452" y="170" class="tx b" text-anchor="middle">Aeronave</text>
  <text x="476" y="218" class="txa b">Onda espacial</text>
  <text x="476" y="233" class="tx2" font-size="11">rayo directo y reflejado</text>
  <text x="476" y="247" class="tx2" font-size="11">(VHF y superiores)</text>
  <path d="M68 264 L250 82 L560 280" class="wa-ln thick" fill="none" marker-end="url(#090-ondas-flecha)"/>
  <text x="14" y="130" class="txw b">Onda ionosférica</text>
  <text x="14" y="145" class="tx2" font-size="11">HF; se refracta y vuelve a tierra</text>
  <text x="560" y="304" class="tx b" text-anchor="middle">Receptor lejano</text>
  <text x="410" y="326" class="tx2" text-anchor="middle">Zona de silencio</text>
  <line x1="290" y1="334" x2="548" y2="334" class="ln2 dash"/>
</svg>
