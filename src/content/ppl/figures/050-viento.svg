<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
  <title>Fuerzas sobre el viento en el hemisferio norte: viento geostrófico en altura con gradiente y Coriolis en equilibrio, y viento en superficie desviado hacia la baja por la fricción</title>
  <defs>
    <marker id="050-viento-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ac-fill"/></marker>
    <marker id="050-viento-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker>
    <marker id="050-viento-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ok-fill"/></marker>
    <marker id="050-viento-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="ink-fill"/></marker>
  </defs>
  <rect x="10" y="40" width="300" height="240" rx="6" class="soft"/>
  <rect x="330" y="40" width="300" height="240" rx="6" class="soft"/>
  <text x="160" y="28" class="tx b" text-anchor="middle">En altura: viento geostrófico</text>
  <text x="480" y="28" class="tx b" text-anchor="middle">En superficie: la fricción lo desvía</text>
  <line x1="20" y1="80" x2="300" y2="80" class="ln2"/>
  <line x1="20" y1="130" x2="300" y2="130" class="ln2"/>
  <line x1="20" y1="230" x2="300" y2="230" class="ln2"/>
  <text x="30" y="72" class="tx b">B (baja presión)</text>
  <text x="30" y="248" class="tx b">A (alta presión)</text>
  <text x="290" y="124" class="tx2" text-anchor="end" font-size="11">isobaras</text>
  <line x1="340" y1="80" x2="620" y2="80" class="ln2"/>
  <line x1="340" y1="130" x2="620" y2="130" class="ln2"/>
  <line x1="340" y1="230" x2="620" y2="230" class="ln2"/>
  <text x="350" y="72" class="tx b">B (baja presión)</text>
  <text x="350" y="248" class="tx b">A (alta presión)</text>
  <text x="610" y="124" class="tx2" text-anchor="end" font-size="11">isobaras</text>
  <circle cx="160" cy="180" r="4" class="ink-fill"/>
  <line x1="160" y1="180" x2="270" y2="180" class="ln thick" marker-end="url(#050-viento-v)"/>
  <text x="220" y="172" class="tx b" text-anchor="middle">viento</text>
  <line x1="160" y1="180" x2="160" y2="125" class="ac-ln thick" marker-end="url(#050-viento-g)"/>
  <text x="152" y="150" class="txa b" text-anchor="end" font-size="12">gradiente</text>
  <line x1="160" y1="180" x2="160" y2="235" class="wa-ln thick" marker-end="url(#050-viento-c)"/>
  <text x="152" y="214" class="txw b" text-anchor="end" font-size="12">Coriolis</text>
  <circle cx="480" cy="190" r="4" class="ink-fill"/>
  <line x1="480" y1="190" x2="575.3" y2="135.0" class="ln thick" marker-end="url(#050-viento-v)"/>
  <text x="571" y="127" class="tx b" text-anchor="end">viento</text>
  <line x1="480" y1="190" x2="480" y2="132" class="ac-ln thick" marker-end="url(#050-viento-g)"/>
  <text x="472" y="154" class="txa b" text-anchor="end" font-size="12">gradiente</text>
  <line x1="480" y1="190" x2="505.0" y2="233.3" class="wa-ln thick" marker-end="url(#050-viento-c)"/>
  <text x="511" y="241" class="txw b" font-size="12">Coriolis</text>
  <line x1="480" y1="190" x2="454.9" y2="204.5" class="ok-ln thick" marker-end="url(#050-viento-f)"/>
  <text x="451" y="220" class="txo b" text-anchor="end" font-size="12">fricción</text>
  <path d="M510 190 A30 30 0 0 0 506 175" class="ln2" fill="none"/>
  <text x="528" y="176" class="tx2" font-size="11">≈ 30° (tierra)</text>
  <text x="320" y="302" class="tx2" text-anchor="middle" font-size="11">Hemisferio norte: con el viento en la espalda, la baja queda a la izquierda</text>
</svg>