<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <title>Modelo del queso suizo de Reason: una trayectoria de accidente que atraviesa los agujeros alineados de varias defensas</title>
  <defs><marker id="040-queso-flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="wa-fill"/></marker></defs>
  <rect x="100" y="40" width="70" height="170" rx="6" class="soft"/>
  <rect x="220" y="40" width="70" height="170" rx="6" class="soft"/>
  <rect x="340" y="40" width="70" height="170" rx="6" class="soft"/>
  <rect x="460" y="40" width="70" height="170" rx="6" class="soft"/>
  <ellipse cx="135" cy="125" rx="14" ry="20" class="bg-fill"/>
  <ellipse cx="135" cy="70" rx="9" ry="12" class="bg-fill"/>
  <ellipse cx="255" cy="125" rx="14" ry="20" class="bg-fill"/>
  <ellipse cx="255" cy="180" rx="9" ry="12" class="bg-fill"/>
  <ellipse cx="375" cy="125" rx="14" ry="20" class="bg-fill"/>
